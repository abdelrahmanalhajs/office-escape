<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>اجتماع كان ممكن يبقى إيميل</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&family=Aref+Ruqaa:wght@400;700&display=swap">
<style>
/* Layout: sticky office HUD (team · room track · clock). Every room uses the same frame:
   header → "المطلوب" goal strip → scene (clues) → answer → hints; a "دفتر الفريق" keeps everything found so far. */
:root{
  --bg:#e6e9ee;--surface:#f6f7f9;--ink:#1c2230;--muted:#5d6678;--line:#c9ced8;
  --note:#ffe066;--note-ink:#3a2f00;--accent:#2350c8;--accent-ink:#ffffff;--alarm:#d7263d;--ok:#1f8a4c;
  --bezel:#22262f;--screen:#0f2a5c;--screen-2:#2f5fb8;--paper:#fffdf6;--paper-ink:#262626;--wood:#9b6a3f;--wood-2:#6e4426;
  --shadow:0 1px 2px rgba(20,30,50,.08),0 8px 24px rgba(20,30,50,.10);
  --f-display:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-hand:"Aref Ruqaa","IBM Plex Sans Arabic",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121722;--surface:#1b2230;--ink:#e8ecf3;--muted:#9aa4b8;--line:#2e3747;
  --note:#f2d34f;--note-ink:#2e2500;--accent:#6f95ff;--accent-ink:#0b1430;--alarm:#ff5a6e;--ok:#4cc982;
  --bezel:#07090d;--screen:#0a1d42;--screen-2:#21468f;--paper:#f3efe2;--paper-ink:#222;--wood:#8a5a34;--wood-2:#5a3720;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121722;--surface:#1b2230;--ink:#e8ecf3;--muted:#9aa4b8;--line:#2e3747;
  --note:#f2d34f;--note-ink:#2e2500;--accent:#6f95ff;--accent-ink:#0b1430;--alarm:#ff5a6e;--ok:#4cc982;
  --bezel:#07090d;--screen:#0a1d42;--screen-2:#21468f;--paper:#f3efe2;--paper-ink:#222;--wood:#8a5a34;--wood-2:#5a3720;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:clamp(2.1rem,6vw,3.4rem)}
h2{font-size:clamp(1.6rem,4vw,2.2rem)}
h3{font-size:1.3rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{appearance:none;border:0;cursor:pointer;border-radius:10px;padding:.65em 1.3em;font-weight:700;background:var(--accent);color:var(--accent-ink);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.big{font-size:1.15rem;padding:.8em 1.8em}
.btn.sm{padding:.35em .9em;font-size:.85rem}
.btn.danger{background:var(--alarm);color:#fff}
.btn.okb{background:var(--ok);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:.6em .9em;min-width:0}
.field:focus{border-color:var(--accent);outline:none}
.ltr{direction:ltr;unicode-bidi:isolate}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.eyebrow{font-size:.8rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
.lead{font-size:1.08rem;max-width:64ch}
.msg{min-height:1.6em;font-weight:700}
.msg.err{color:var(--alarm)}
.msg.good{color:var(--ok)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.scene{animation:enter .35s ease-out}
@keyframes enter{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:24px}
.hud-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.team{font-weight:700;min-width:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gcode{font-family:var(--f-mono);font-size:.85rem;border:1.5px dashed var(--line);border-radius:6px;padding:0 .5em;font-weight:500}
.clock{font-family:var(--f-mono);font-weight:700;font-size:1.7rem;letter-spacing:.04em;padding:.1em .55em;border-radius:8px;background:var(--surface);border:1.5px solid var(--line);direction:ltr}
.clock.warn{color:var(--alarm);border-color:var(--alarm);animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{opacity:.55}}
.track{display:flex;gap:6px;align-items:center;font-size:.85rem;flex-wrap:wrap}
.track span{padding:.15em .7em;border-radius:99px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.track span.on{background:var(--note);color:var(--note-ink);border-color:var(--note);font-weight:700}
.track span.done{color:var(--ok);border-color:var(--ok)}

/* room frame */
.room-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.target{font-size:.85rem;color:var(--muted)}
.goal{display:flex;gap:12px;align-items:flex-start;background:var(--ink);color:var(--bg);border-radius:12px;padding:14px 18px}
.goal b{font-family:var(--f-display);font-weight:400;font-size:1.15rem;white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:start}
.notebook{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:16px;box-shadow:var(--shadow);background-image:repeating-linear-gradient(to bottom,transparent 0 27px,#b9c6dd66 27px 28px);font-size:.95rem}
.notebook h3{font-size:1.1rem;margin-bottom:6px}
.notebook ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.notebook li{line-height:1.6}
.notebook .empty{color:#666}
.step-title{font-weight:700;margin-bottom:4px}
.checklist{display:flex;gap:10px;flex-wrap:wrap;font-size:.9rem}
.checklist span{padding:.15em .7em;border-radius:99px;border:1.5px solid var(--line)}
.checklist span.ok{border-color:var(--ok);color:var(--ok);font-weight:700}

/* intro */
.intro-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center;padding-block:16px}
.memo{background:var(--paper);color:var(--paper-ink);padding:24px 22px;border-radius:4px;box-shadow:var(--shadow);transform:rotate(-1.2deg);position:relative}
.memo::before{content:"";position:absolute;top:-10px;right:50%;width:90px;height:22px;background:color-mix(in srgb,var(--note) 70%,transparent);transform:translateX(50%) rotate(2deg)}
.stamp{display:inline-block;border:2px solid var(--alarm);color:var(--alarm);font-weight:700;padding:0 .5em;border-radius:4px;transform:rotate(-4deg);margin-bottom:8px;font-size:.85rem}
.timeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.timeline div{border-top:3px solid var(--line);padding-top:8px}
.timeline div:first-child{border-color:var(--note)}
.timeline b{display:block}
.setup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.setup label{display:flex;flex-direction:column;gap:6px;font-weight:500;min-width:0}
.players{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:var(--surface)}
.mode:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.mode input{margin-top:.4em;accent-color:var(--accent)}
.mode b{display:block}
details.host summary{cursor:pointer;font-weight:700;padding-block:6px}
.answers{font-size:.92rem}
.answers li{margin-bottom:4px}

/* sticky notes */
.notes{display:flex;gap:16px;flex-wrap:wrap}
.sticky{background:var(--note);color:var(--note-ink);padding:14px 14px 16px;box-shadow:var(--shadow);font-family:var(--f-hand);font-size:1.1rem;line-height:1.6;position:relative;flex:1 1 140px;transform:rotate(1.5deg)}
.sticky:nth-child(2){transform:rotate(-2deg)}
.sticky:nth-child(3){transform:rotate(1deg)}
.sticky.warnnote{background:color-mix(in srgb,var(--alarm) 18%,var(--paper));color:var(--paper-ink);flex-basis:100%}

/* laptop */
.lid{background:var(--bezel);border-radius:16px 16px 6px 6px;padding:14px}
.screen{border-radius:4px;background:radial-gradient(120% 90% at 80% 10%,var(--screen-2),var(--screen));color:#fff;padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
.photo{background:#ffffff14;border:1px solid #ffffff40;border-radius:8px;padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.photo .n{position:absolute;top:4px;inset-inline-start:6px;font-family:var(--f-mono);font-size:.75rem;background:#fff;color:#0f2a5c;border-radius:4px;padding:0 .4em;font-weight:700}
.photo svg{width:100%;max-width:90px;height:auto}
.photo span{font-size:.82rem;opacity:.9}
.lockline{font-family:var(--f-hand);font-size:1.15rem;opacity:.95}
.pw{display:flex;gap:8px;width:min(320px,100%)}
.pw input{flex:1;background:#ffffff1f;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:.5em .8em;direction:ltr;text-align:center;letter-spacing:.4em;min-width:0;font-family:var(--f-mono)}
.pw input::placeholder{color:#ffffffaa;letter-spacing:normal;font-family:var(--f-body)}
.pw button{background:#fff;color:#0f2a5c;border:0;border-radius:8px;padding:0 1em;font-weight:700;cursor:pointer}
.screen .msg.err{color:#ffb3bd}
.screen .msg.good{color:#9ff0c0}
.base{height:16px;background:linear-gradient(var(--line),color-mix(in srgb,var(--line) 60%,var(--bezel)));border-radius:0 0 18px 18px;margin:0 -16px}

/* inspectable items */
.items{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.items.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.item{border:1.5px dashed var(--line);border-radius:12px;padding:12px;background:var(--surface);cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:flex-start;min-height:150px;transition:border-color .15s,transform .15s}
.item:hover{border-color:var(--accent);transform:translateY(-2px)}
.item[aria-expanded="true"]{border-style:solid;border-color:var(--accent);cursor:default;transform:none}
.item .cap{font-weight:700;font-size:.95rem}
.item .where{font-size:.8rem;color:var(--muted)}
.item .tap{font-size:.8rem;color:var(--accent);font-weight:700}
.reveal{width:100%;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:10px;font-size:.9rem;text-align:start;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.reveal table{width:100%;border-collapse:collapse}
.reveal td{padding:2px 4px;border-bottom:1px dotted #bbb}
.reveal td:last-child{font-family:var(--f-mono);font-weight:700;text-align:left;direction:ltr}
.plate{font-family:var(--f-mono);font-weight:700;background:#c9a43c;color:#2a1d00;padding:.2em .8em;border-radius:4px;letter-spacing:.1em;direction:ltr;display:inline-block}
.gcard{font-family:var(--f-mono);font-weight:700;background:#1c2230;color:#ffd84d;padding:.4em .8em;border-radius:6px;direction:ltr;display:inline-block;font-size:1.3rem}

/* mail */
.mail{display:grid;grid-template-columns:150px minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.mail-side{background:color-mix(in srgb,var(--accent) 8%,var(--surface));padding:14px;display:flex;flex-direction:column;gap:6px;font-size:.92rem;border-inline-end:1px solid var(--line)}
.mail-side .f{padding:.3em .6em;border-radius:6px}
.mail-side .f.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.mail-body{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.mail-item{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--bg)}
.mail-item.urgent{border-color:var(--alarm);background:color-mix(in srgb,var(--alarm) 6%,var(--surface))}
.mail-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.mail-subj{font-weight:700;font-size:1.05rem}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:0 .6em;border-radius:99px}
.tag.sent{background:var(--ok);color:#fff}
.tag.red{background:var(--alarm);color:#fff}
.dest{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.dest div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.dest small{display:block;color:var(--muted);font-size:.75rem}

/* fax */
.faxwrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
.faxmachine{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;width:fit-content;max-width:100%}
.label{background:#fff;color:#111;border:1px solid #999;font-size:.85rem;padding:4px 8px;border-radius:3px;font-weight:700}
.tray{border:2px dashed var(--line);border-radius:8px;padding:8px;text-align:center;font-size:.9rem;cursor:pointer;background:var(--bg)}
.tray.full{border-style:solid;border-color:var(--ok);color:var(--ok);font-weight:700}
.lcd{background:#9db08a;color:#18240f;font-family:var(--f-mono);border-radius:6px;padding:.35em .8em;font-size:1.4rem;letter-spacing:.2em;direction:ltr;text-align:left;min-height:2em;border:2px inset #6f805e;overflow:hidden;white-space:nowrap}
.keys{display:grid;grid-template-columns:repeat(3,56px);gap:8px;direction:ltr}
.keys button{height:46px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-mono);font-weight:700;font-size:1.1rem;cursor:pointer}
.keys button:hover{border-color:var(--accent)}
.keys .k-send{background:var(--ok);color:#fff;border-color:var(--ok)}
.keys .k-clr{color:var(--alarm)}
.receipt{background:var(--paper);color:var(--paper-ink);font-family:var(--f-mono);padding:14px 16px;border-radius:3px;box-shadow:var(--shadow);direction:ltr;text-align:left;white-space:pre;overflow-x:auto;max-width:100%;font-size:.9rem}

/* meeting room */
.door-wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
.door{aspect-ratio:3/5.2;max-width:100%;background:linear-gradient(90deg,var(--wood-2),var(--wood) 40%,var(--wood-2));border-radius:6px 6px 0 0;position:relative;box-shadow:inset 0 0 0 10px var(--wood-2),var(--shadow);border-bottom:8px solid #4b2e19}
.door .dplate{position:absolute;top:14%;left:50%;transform:translateX(-50%);background:#eef1f5;color:#1c2230;font-weight:700;font-size:.8rem;padding:.3em .8em;border-radius:4px;white-space:nowrap;direction:ltr}
.door .knob{position:absolute;top:54%;left:14%;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c8,#c9a43c 60%,#7a5d16)}
.door .lock{position:absolute;top:62%;left:12%;width:24px;height:30px;background:#2a2a2a;border-radius:4px;display:grid;place-items:center;color:#ff6b6b;font-size:.7rem}
.door.open{background:linear-gradient(90deg,#3b3f4a,#1c2230)}
.door.open .lock{color:#5af08e}
.suspects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.suspect{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px}
.suspect .who{display:flex;gap:10px;align-items:center}
.suspect .face{width:42px;height:42px;border-radius:50%;background:var(--note);color:var(--note-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:1.3rem;flex:none}
.suspect .say{background:var(--bg);border-radius:10px;border-start-start-radius:2px;padding:8px 12px;font-weight:700}
.suspect .plays{font-size:.8rem;color:var(--muted)}
.suspect .env{margin-top:auto}
.suspect.pick{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.truth{display:flex;gap:6px;font-size:.8rem}
.truth button{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:0 .7em;cursor:pointer}
.truth button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rules{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:16px 18px;box-shadow:var(--shadow)}
.rules ol{margin:6px 0 0;padding-inline-start:1.3em}
.digits{display:flex;gap:10px;direction:ltr;justify-content:center}
.digits span{width:52px;height:60px;display:grid;place-items:center;border-radius:8px;background:var(--note);color:var(--note-ink);font-family:var(--f-mono);font-weight:700;font-size:1.8rem;box-shadow:var(--shadow)}
.stations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.station{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.station form{display:flex;gap:8px}
.station input{direction:ltr;text-align:center;letter-spacing:.3em;font-family:var(--f-mono)}
.joined{display:flex;gap:8px;flex-wrap:wrap}
.joined span{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:0 .8em;font-size:.9rem}
.bigcode{font-family:var(--f-mono);font-size:2rem;font-weight:700;letter-spacing:.2em;direction:ltr;display:inline-block;background:var(--ink);color:var(--bg);padding:.1em .6em;border-radius:8px}

/* hints */
.hintbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:16px;border-top:1px dashed var(--line)}
.hintbox{background:color-mix(in srgb,var(--note) 30%,var(--surface));border-inline-start:4px solid var(--note);padding:10px 14px;border-radius:6px;width:100%}
.btn.nudge{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--note) 60%,transparent)}}

/* end */
.end{text-align:center;padding-block:32px;display:flex;flex-direction:column;align-items:center;gap:18px}
.end .big{font-family:var(--f-mono);font-size:clamp(2.4rem,9vw,4rem);font-weight:700;direction:ltr}
.trophy{font-family:var(--f-display);font-size:1.3rem;background:var(--note);color:var(--note-ink);padding:.2em 1em;border-radius:6px;transform:rotate(-2deg)}
.boss{max-width:520px;text-align:start}
.stats{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.stats b.ltr{font-family:var(--f-mono)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}

/* leaderboard */
.board{width:100%;text-align:start}
.board-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden;font-size:.85rem}
.seg button{border:0;background:transparent;padding:.3em .9em;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th{font-size:.78rem;color:var(--muted);font-weight:700;text-align:start;padding:6px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.t{white-space:normal;font-weight:700;min-width:8em}
.tbl tr.me td{background:color-mix(in srgb,var(--note) 30%,transparent)}
.tbl tr.out td{color:var(--muted)}
.rank{display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;border:1.5px solid var(--line);font-family:var(--f-mono);font-weight:700;font-size:.85rem}
.rank.r1{background:var(--note);color:var(--note-ink);border-color:var(--note)}
.board-empty{padding:18px;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
.board-note{font-size:.85rem;color:var(--muted);margin-top:8px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .notebook{position:static}
}
@media (max-width:700px){
  .intro-hero,.door-wrap,.faxwrap{grid-template-columns:1fr}
  .setup,.modes,.timeline{grid-template-columns:1fr}
  .players{grid-template-columns:repeat(2,minmax(0,1fr))}
  .items,.items.three,.photos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .suspects,.stations,.dest{grid-template-columns:1fr}
  .mail{grid-template-columns:1fr}
  .mail-side{flex-direction:row;flex-wrap:wrap;border-inline-end:0;border-bottom:1px solid var(--line)}
  .door-wrap .door{width:170px;margin-inline:auto}
  .base{margin:0 -8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
const $=s=>document.querySelector(s);
const app=$('#app');
const ANS={r1:'6273',r2:'248631',r3a:'omar',r3b:'3726'};
const DEFAULT={screen:'intro',team:'',players:['','','',''],mode:'a',duration:20,penalty:60,
  startedAt:0,pen:0,hints:{r1:0,r2:0,r3:0},seen:{},roomAt:0,unlocked:false,printed:false,tray:false,faxed:false,
  r3At:0,doneAt:0,code:'',winner:'',lastRoom:'r1',submittedAt:0};
let S=JSON.parse(JSON.stringify(DEFAULT));
let tick=null;
const AR_DIG='٠١٢٣٤٥٦٧٨٩';
const digits=s=>String(s||'').replace(/[٠-٩]/g,d=>AR_DIG.indexOf(d)).replace(/\D/g,'');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function elapsed(){if(!S.startedAt)return 0;const end=S.doneAt||Date.now();return Math.max(0,(end-S.startedAt)/1000+S.pen)}
function remaining(){return Math.max(0,S.duration*60-elapsed())}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function clockTime(ms){const d=new Date(ms);return [d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':')}
const pname=(i,fb)=>(S.players[i]||'').trim()||fb;
let actx=null;
function beep(ok){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  (ok?[660,880,1175]:[220,180]).forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*.11;o.type=ok?'triangle':'square';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.2);});}catch(e){}}
function fail(el,msgEl,text){beep(false);if(msgEl){msgEl.textContent=text;msgEl.className='msg err';}if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}}
function good(msgEl,text){beep(true);if(msgEl){msgEl.textContent=text;msgEl.className='msg good';}}

/* ---------- HUD ---------- */
const ROOMS=['r1','r2','r3'];
function hud(){
  const playing=ROOMS.includes(S.screen);
  $('#hud').hidden=!(playing||S.screen==='win'||S.screen==='lose');
  $('#hudTeam').textContent=S.team?('فريق: '+S.team):'';
  const hc=$('#hudCode'); hc.hidden=!(S.mode==='b'&&S.code&&playing&&B.state!=='off'); hc.textContent='كود اللعبة '+S.code;
  const idx=ROOMS.indexOf(S.screen), endIdx=S.screen==='win'?3:idx;
  [...$('#track').children].forEach((sp,i)=>{sp.className=i<endIdx?'done':(i===idx?'on':'')});
  const r=remaining(), c=$('#clock'); c.textContent=fmt(r); c.classList.toggle('warn',playing&&r<=120);
  if(playing){
    const stall=(Date.now()-S.roomAt)/1000>150, hb=$('#hintBtn'); if(hb) hb.classList.toggle('nudge',stall);
    if(r<=0){S.screen='lose';S.doneAt=S.startedAt+(S.duration*60-S.pen)*1000;go();}
  }
}
function startTick(){clearInterval(tick);tick=setInterval(hud,500)}
function go(screen){
  if(screen){S.screen=screen;S.roomAt=Date.now();}
  if(ROOMS.includes(S.screen)) S.lastRoom=S.screen;
  syncGame(); render();
}

/* ---------- hints (3 per puzzle, from the design doc) ---------- */
const HINTS={
  r1:['الصور بتوري خطوات يوم مروان بالترتيب.',
      'كل خطوة مربوطة بمكان، وكل مكان عليه رقم.',
      'العربية = 6 والدور = 2. كمّلوا برقم المكتب ورقم الدرج.'],
  r2:['ارجعوا لرد الإيميل وشوفوا الوجهة قبل ما تختاروا الأكواد.',
      'محتاجين فرع واحد وقسم واحد وجهاز واحد، بنفس ترتيب الملصق.',
      'جولف لاند 24، المشروعات 86، الجهاز B هو 31. حطوهم جنب بعض.'],
  r3a:['جربوا الجمل المكتوبة نفسها، مش وشوش اللاعبين.',
      'لكل احتمال: المفتاح مع مين؟ عدّوا كام جملة بقت صح.',
      'لو المفتاح مع عمر، سلمى بس اللي بتقول الحقيقة.'],
  r3b:['خلّوا الأربع أرقام بتوع لابتوب مروان والأربع قواعد قدامكم.',
      'ثبّتوا الرقم التاني الأول، وبعدين دوروا على رقمين مجموعهم 9.',
      '7 في الخانة التانية، والطرفين 3 و6، والأصغر في الأول.']
};
function hintKey(room){return room==='r3'?(S.mode==='a'?'r3a':'r3b'):room}
function hintBlock(room){
  const list=HINTS[hintKey(room)], used=S.hints[room]||0;
  const cost=S.penalty?` (−${S.penalty>=60?S.penalty/60+' دقيقة':S.penalty+' ثانية'})`:'';
  return `<div class="hintbar">${used<list.length?`<button class="btn ghost" id="hintBtn" type="button">مساعدة ${used+1} من ${list.length}${cost}</button>`:''}
    <span class="muted">${used?`استخدمتوا ${used} من ${list.length}`:(room==='r3'&&S.mode==='b'?'المساعدة بتظهر لكل اللاعبين مرة واحدة':'المساعدات بتظهر واحدة واحدة')}</span>
    ${list.slice(0,used).map(h=>`<div class="hintbox">${esc(h)}</div>`).join('')}</div>`;
}
function wireHint(room){const b=$('#hintBtn');if(b)b.onclick=()=>{S.hints[room]=(S.hints[room]||0)+1;S.pen+=S.penalty;S.roomAt=Date.now();go();}}

/* ---------- shared frame ---------- */
function frame({n,title,target,goal,body,room}){
  return `<section class="scene stack">
    <div class="room-head"><div class="stack" style="gap:2px"><span class="eyebrow">المرحلة ${n} من ٣</span><h2>${title}</h2></div><span class="target">الوقت المقترح: ~${target} دقايق</span></div>
    <div class="goal"><b>المطلوب</b><span>${goal}</span></div>
    <div class="layout"><div class="stack" style="gap:24px;min-width:0">${body}${hintBlock(room)}</div>${notebook()}</div>
  </section>`;
}
function notebook(){
  const L=[];
  if(S.seen.card) L.push('كارت الجراج: <b class="ltr">P6</b>');
  if(S.seen.dir) L.push('مكتب مروان في <b>الدور 2</b>');
  if(S.seen.plate) L.push('لوحة المكتب: <b class="ltr">Desk 7</b>');
  if(S.seen.drawer) L.push('درج الورق: <b>3</b>');
  if(S.unlocked) L.push('باسورد اللابتوب: <b class="mono">6273</b>');
  if(S.printed) L.push('الوجهة: <b>فرع جولف لاند · قسم المشروعات · جهاز B</b>');
  if(S.seen.branch) L.push('كود الفروع في درج الاستقبال');
  if(S.seen.dept) L.push('كود الأقسام على لوحة الإعلانات');
  if(S.seen.device) L.push('كود الأجهزة في ملف الصيانة');
  if(S.faxed) L.push('الفاكس اتبعت ✓');
  return `<aside class="notebook" aria-label="دفتر الفريق"><h3>دفتر الفريق</h3>${L.length?`<ul>${L.map(x=>`<li>• ${x}</li>`).join('')}</ul>`:`<p class="empty">أي حاجة تلاقوها هتتكتب هنا عشان ماتضيعش.</p>`}</aside>`;
}
function item(id,{cap,where,art,reveal}){
  const open=!!S.seen[id];
  return `<button class="item" type="button" data-id="${id}" aria-expanded="${open}">${art}<span class="cap">${cap}</span><span class="where">${where}</span>${open?`<div class="reveal">${reveal}</div>`:`<span class="tap">دوسوا تبصّوا</span>`}</button>`;
}
function wireItems(){app.querySelectorAll('.item').forEach(b=>b.onclick=()=>{if(!S.seen[b.dataset.id]){S.seen[b.dataset.id]=true;S.roomAt=Date.now();render();}})}

/* ---------- art ---------- */

/* ---------- intro ---------- */
function intro(){
  app.innerHTML=`<section class="scene stack" style="gap:24px">
    <div class="intro-hero">

    S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),keep);

  };
  renderBoard();
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confetti');c.hidden=false;const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#ffe066','#2350c8','#d7263d','#1f8a4c','#ffffff'];
  const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,w:6+Math.random()*6,h:10+Math.random()*8,vy:2+Math.random()*3,vx:-1+Math.random()*2,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});
    if(++t<260)requestAnimationFrame(f);else{x.clearRect(0,0,c.width,c.height);c.hidden=true;}})();
}

/* ---------- shared data: leaderboard + race ---------- */
const B={state:'loading',docs:[],sort:'fast',canClear:false,confirming:false,myId:null,err:''};
let DB=null, runsCol=null, gameUnsubs=[], joinedNames=[];
const TAB=Math.random().toString(36).slice(2,10);
try{const v=localStorage.getItem('oe-sort');if(v==='first'||v==='fast')B.sort=v;}catch(e){}
function newCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join('')}
const useCap=n=>{try{return Promise.resolve(window.claude?.use?.(n)??null).catch(()=>null)}catch(e){return Promise.resolve(null)}};
(async()=>{
  const timer=setTimeout(()=>{if(B.state==='loading'){B.state='slow';renderBoard();}},10000);
  DB=await useCap('db');
  if(!DB){clearTimeout(timer);B.state='off';renderBoard();if(view==='join')renderJoin();hud();return;}
  runsCol=DB.collection('runs');
  const user=await useCap('user');
  B.canClear=user?await user.canEdit().catch(()=>false):false;
  runsCol.orderBy('finishedAt','asc').limit(500).onSnapshot(snap=>{
    B.docs=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!snap.metadata.fromCache)clearTimeout(timer);
    B.state='ok';renderBoard();
  },e=>{clearTimeout(timer);B.state='err';B.err=e&&e.code||'';renderBoard();});
  if(view==='join')renderJoin();
  if(S.code&&ROOMS.includes(S.screen)){syncGame();watchGame();if(S.screen==='r3')render();}
  if(S.pendingRun)submitRun(S.pendingRun.won);
})();
let lastSync='';
async function syncGame(){
  if(!DB||!S.code||S.mode!=='b')return;
  const body={stage:S.screen,hints:S.hints.r3||0,team:S.team,startedAt:S.startedAt};
  const key=JSON.stringify(body); if(key===lastSync)return; lastSync=key;
  try{await DB.doc('games/'+S.code).set(body);}catch(e){}
  watchGame();
}
function watchGame(){
  if(!DB||!S.code||S.mode!=='b'||gameUnsubs.code===S.code)return;
  gameUnsubs.forEach(u=>u());gameUnsubs=[];gameUnsubs.code=S.code;
  gameUnsubs.push(DB.collection('games/'+S.code+'/players').onSnapshot(s=>{joinedNames=s.docs.map(d=>d.data().name).filter(Boolean);renderJoined();},()=>{}));
  gameUnsubs.push(DB.doc('games/'+S.code+'/meta/winner').onSnapshot(s=>{const w=s.exists&&s.data().name;if(w&&S.screen==='r3')finishB(w);},()=>{}));
}
function renderJoined(){const el=$('#joined');if(!el)return;el.innerHTML=joinedNames.length?joinedNames.map(n=>`<span>${esc(n)}</span>`).join(''):'<span class="muted">لسه محدش دخل...</span>';}
async function claimWin(name,code){
  code=code||S.code;
  if(!DB||!code)return {won:true};
  const ref=DB.doc('games/'+code+'/meta/winner');
  try{
    const r=await ref.acquire({holder:TAB,ttlMs:5000});
    if(!r.acquired){await new Promise(z=>setTimeout(z,1200));const s=await ref.get();return {won:false,by:s.exists?s.data().name:''};}
    const s=await ref.get();
    if(s.exists&&s.data().name)return {won:s.data().name===name&&s.data().tab===TAB,by:s.data().name};
    await ref.set({name:String(name).slice(0,20),at:Date.now(),tab:TAB});
    return {won:true};
  }catch(e){return {won:true};}
}
async function submitRun(won){
  if(!S.startedAt||S.submittedAt===S.startedAt)return;
  if(!runsCol){S.pendingRun={won};return;}
  S.submittedAt=S.startedAt;S.pendingRun=null;
  const hints=(S.hints.r1||0)+(S.hints.r2||0)+(S.hints.r3||0);
  try{const ref=await runsCol.add({team:String(S.team).slice(0,30),won:!!won,seconds:Math.round(elapsed()),hints,finishedAt:S.doneAt||Date.now(),startedAt:S.startedAt,mode:S.mode,winner:S.winner||'',reached:won?'end':(S.lastRoom||'r1')});
    B.myId=ref.id;renderBoard();
  }catch(e){S.submittedAt=0;const n=$('#boardMsg');if(n)n.textContent='النتيجة ماتسجلتش على اللوحة. المنظِّم يقدر يكتبها بإيده.';}
}
function renderBoard(){
  const el=$('#board');if(!el)return;
  const head=`<div class="board-head"><h3>لوحة النتايج</h3><div class="seg" role="group" aria-label="الترتيب"><button type="button" data-s="fast" aria-pressed="${B.sort==='fast'}">أسرع وقت</button><button type="button" data-s="first" aria-pressed="${B.sort==='first'}">أول من خلّص</button></div></div>`;
  let body='';
  if(B.state==='off')body=`<div class="board-empty">لوحة النتايج المشتركة مش شغالة هنا. افتحوا اللعبة من اللينك وانتوا عاملين تسجيل دخول عشان النتايج تتجمع.</div>`;
  else if(B.state==='err')body=`<div class="board-empty">مش قادرين نوصل للوحة دلوقتي.</div>`;
  else if(B.state==='loading')body=`<div class="board-empty">بنحمّل النتايج...</div>`;
  else if(!B.docs.length)body=`<div class="board-empty">لسه مفيش فرق خلّصت. أول فريق يلحق الاجتماع هيظهر هنا.</div>`;
  else{
    const won=B.docs.filter(d=>d.won),lost=B.docs.filter(d=>!d.won);
    won.sort(B.sort==='fast'?(a,b)=>a.seconds-b.seconds||a.finishedAt-b.finishedAt:(a,b)=>a.finishedAt-b.finishedAt);
    lost.sort((a,b)=>b.finishedAt-a.finishedAt);
    const REACH={r1:'مكتب مروان',r2:'غرفة الفاكس',r3:'الميتينج روم'};
    const rows=won.map((d,i)=>`<tr class="${d.id===B.myId?'me':''}"><td><span class="rank ${i===0?'r1':''}">${i+1}</span></td><td class="t">${esc(d.team||'—')}${d.winner?`<div class="muted" style="font-weight:400;font-size:.85rem">أول واحد دخل: ${esc(d.winner)}</div>`:''}</td><td class="mono ltr">${fmt(d.seconds)}</td><td class="mono ltr">${clockTime(d.finishedAt)}</td><td class="mono">${d.hints|0}</td></tr>`).join('')
      +lost.map(d=>`<tr class="out ${d.id===B.myId?'me':''}"><td>—</td><td class="t">${esc(d.team||'—')}</td><td colspan="2">ما لحقوش · وقفوا في ${REACH[d.reached]||'—'}</td><td class="mono">${d.hints|0}</td></tr>`).join('');
    body=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>الفريق</th><th>الوقت</th><th>خلّصوا الساعة</th><th>مساعدات</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  const note=B.state==='slow'?`<p class="board-note">اللوحة بتاخد وقت عشان تتحمّل، ممكن تكون مش محدّثة.</p>`:'';
  const clear=B.canClear&&B.docs.length?(B.confirming
    ?`<div class="confirm" style="margin-top:12px"><span>هتمسح ${B.docs.length} نتيجة ومش هترجع. متأكدين؟</span><button class="btn sm danger" type="button" id="clearYes">امسح</button><button class="btn sm ghost" type="button" id="clearNo">لأ</button></div>`
    :`<div style="margin-top:12px"><button class="btn sm ghost" type="button" id="clearBtn">مسح اللوحة لجولة جديدة</button></div>`):'';
  el.innerHTML=head+body+note+`<p class="board-note" id="boardMsg" aria-live="polite"></p>`+clear;
  el.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{B.sort=b.dataset.s;try{localStorage.setItem('oe-sort',B.sort)}catch(e){};renderBoard();});
  const cb=$('#clearBtn');if(cb)cb.onclick=()=>{B.confirming=true;renderBoard();};
  const cn=$('#clearNo');if(cn)cn.onclick=()=>{B.confirming=false;renderBoard();};
  const cy=$('#clearYes');if(cy)cy.onclick=async()=>{cy.disabled=true;for(const d of [...B.docs]){try{await runsCol.doc(d.id).delete();}catch(e){}}B.confirming=false;renderBoard();};
}

/* ---------- phone station (#join) ---------- */
let view=location.hash==='#join'?'join':'game';
const J={code:'',name:'',stage:'',hints:0,winner:'',unsubs:[],msg:''};
try{const j=JSON.parse(sessionStorage.getItem('oe-join')||'null');if(j){J.code=j.code;J.name=j.name;}}catch(e){}
function renderJoin(){
  $('#hud').hidden=true;
  const back=`<a href="#" class="btn ghost sm" id="backGame">رجوع للعبة</a>`;
  if(B.state==='off'){app.innerHTML=`<section class="scene stack"><h2>محطة لاعب</h2><div class="board-empty">محطة الموبايل محتاجة تكون عامل تسجيل دخول وفاتح اللعبة من اللينك. لو مش متاح، ادخل من الشاشة الرئيسية.</div>${back}</section>`;return;}
  if(!DB){app.innerHTML=`<section class="scene stack"><h2>محطة لاعب</h2><p class="muted">بنجهّز المحطة...</p>${back}</section>`;return;}
  if(!J.subscribed){
    app.innerHTML=`<section class="scene stack"><span class="eyebrow">محطة لاعب · سباق الميتينج روم</span><h2>ادخل السباق</h2>
      <form class="panel stack" id="jForm" autocomplete="off">
        <label for="jCode" class="stack" style="gap:6px">كود اللعبة (على الشاشة الرئيسية)<input class="field mono" id="jCode" maxlength="4" style="direction:ltr;text-align:center;letter-spacing:.3em;text-transform:uppercase" value="${esc(J.code)}"></label>
        <label for="jName" class="stack" style="gap:6px">اسمك<input class="field" id="jName" maxlength="20" value="${esc(J.name)}"></label>
        <button class="btn big" type="submit">ادخل</button><div class="msg err" id="jMsg">${esc(J.msg)}</div></form>${back}</section>`;
    $('#jForm').onsubmit=async e=>{e.preventDefault();
      const code=$('#jCode').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,''), name=$('#jName').value.trim();
      if(code.length!==4||!name){$('#jMsg').textContent='اكتب الكود (٤ حروف) واسمك.';return;}
      const g=await DB.doc('games/'+code).get().catch(()=>null);
      if(!g||!g.exists){$('#jMsg').textContent='مفيش لعبة بالكود ده. اتأكد منه من الشاشة الرئيسية.';return;}
      J.code=code;J.name=name;try{sessionStorage.setItem('oe-join',JSON.stringify({code,name}))}catch(e){}
      try{await DB.doc('games/'+code+'/players/'+TAB).set({name});}catch(e){}
      J.subscribed=true;
      J.unsubs.push(DB.doc('games/'+code).onSnapshot(s=>{if(s.exists){const d=s.data();J.stage=d.stage;J.hints=d.hints|0;}renderJoin();},()=>{}));
      J.unsubs.push(DB.doc('games/'+code+'/meta/winner').onSnapshot(s=>{J.winner=s.exists?s.data().name||'':'';renderJoin();},()=>{}));
      renderJoin();};
  } else if(J.winner){
    const me=J.winner===J.name&&J.iWon;
    app.innerHTML=`<section class="scene end">${me?`<span class="trophy">كسبت!</span><h1>أسرع واحد دخل اجتماع كان ممكن يبقى إيميل</h1>`:`<h1>${esc(J.winner)} سبقك</h1><p class="lead">الاجتماع بدأ. موضوعه: التأكد إن الإيميل وصل.</p>`}</section>`;
    if(me&&!J.confetti){J.confetti=1;confetti();}
  } else if(J.stage!=='r3'){
    app.innerHTML=`<section class="scene stack"><span class="eyebrow">كود ${esc(J.code)} · ${esc(J.name)}</span><h2>إنت جوه. استنى.</h2>
      <p class="lead">الفريق لسه في ${J.stage==='r2'?'غرفة الفاكس':J.stage==='r1'?'مكتب مروان':'الطريق'}. أول ما يوصلوا الميتينج روم، السباق هيظهر هنا على طول.</p>
      <p class="muted">ساعد فريقك على الشاشة الرئيسية لحد ما ده يحصل.</p></section>`;
  } else {
    const prev=$('#jPw')?$('#jPw').value:'';
    app.innerHTML=`<section class="scene stack"><span class="eyebrow">كود ${esc(J.code)} · ${esc(J.name)}</span><h2>السباق بدأ!</h2>${RULES}
      ${HINTS.r3b.slice(0,J.hints).map(h=>`<div class="hintbox">${esc(h)}</div>`).join('')}
      <form class="row" id="jPwForm" autocomplete="off"><input class="field" id="jPw" inputmode="numeric" maxlength="4" style="flex:1;direction:ltr;text-align:center;letter-spacing:.4em;font-family:var(--f-mono);font-size:1.4rem" placeholder="••••" aria-label="باسورد الاجتماع"><button class="btn big" type="submit">Join</button></form>
      <div class="msg" id="jPwMsg" aria-live="polite"></div></section>`;
    $('#jPw').value=prev;
    $('#jPwForm').onsubmit=async e=>{e.preventDefault();
      if(digits($('#jPw').value)!==ANS.r3b){fail($('#jPwForm'),$('#jPwMsg'),'غلط. راجع القواعد.');return;}
      const r=await claimWin(J.name,J.code); J.iWon=r.won; if(!r.won){J.winner=r.by||'حد تاني';} renderJoin();};
  }
  const bg=$('#backGame');if(bg)bg.onclick=e=>{e.preventDefault();history.replaceState(null,'',location.pathname+location.search);view='game';render();};
}
window.addEventListener('hashchange',()=>{view=location.hash==='#join'?'join':'game';render();});

/* ---------- render ---------- */
function render(){
  document.onkeydown=null;
  if(view==='join'){renderJoin();window.scrollTo({top:0});return;}
  hud();
  ({intro,r1:room1,r2:room2,r3:()=>S.mode==='a'?room3a():room3b(),win:()=>endScreen(true),lose:()=>endScreen(false)})[S.screen]();
  const key=S.screen+(S.unlocked?1:0)+(S.faxed?1:0);
  if(key!==render.last){window.scrollTo({top:0});render.last=key;}
}
function start(data){
  if(data&&data.state&&data.state.screen)S=data.state;
  if(ROOMS.includes(S.screen))startTick();
  render();
}
window.claude?.hot?.snapshot?.(()=>({state:S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
