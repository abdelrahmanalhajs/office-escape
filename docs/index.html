<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
</head>
<body>
<title>DUCK</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Reem+Kufi:wght@400;700&family=Baloo+Bhaijaan+2:wght@500;800&family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&family=Aref+Ruqaa:wght@400;700&family=Bungee&display=swap">
<style>
/* Layout: home = a row of five doors (one per game) + shared scoreboard.
   In a game: sticky HUD (game · room track · evidence bag · clock), then one room at a time:
   header → goal → scene → answer → three 3D hint cards; the evidence bag keeps every clue card found. */
:root{
  --bg:#eef4f9;--surface:#fbfdff;--ink:#123a63;--muted:#56708c;--line:#c5d6e6;
  --accent:#1f6fb5;--accent-ink:#fff;--hi:#f7b021;--hi-ink:#3a2500;--alarm:#d7263d;--ok:#1f8a4c;
  --paper:#fffdf6;--paper-ink:#262626;--glow:#4a9ad455;
  --shadow:0 1px 2px rgba(20,30,50,.08),0 10px 28px rgba(20,30,50,.12);
  --f-display:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-hand:"Aref Ruqaa","IBM Plex Sans Arabic",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1826;--surface:#132437;--ink:#e6f0fa;--muted:#93aac2;--line:#24405c;
  --accent:#5fb0ea;--accent-ink:#06182a;--hi:#f7b021;--hi-ink:#2e2500;--alarm:#ff5a6e;--ok:#4cc982;
  --paper:#f3efe2;--paper-ink:#222;--glow:#6f95ff55;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1826;--surface:#132437;--ink:#e6f0fa;--muted:#93aac2;--line:#24405c;
  --accent:#5fb0ea;--accent-ink:#06182a;--hi:#f7b021;--hi-ink:#2e2500;--alarm:#ff5a6e;--ok:#4cc982;
  --paper:#f3efe2;--paper-ink:#222;--glow:#6f95ff55;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);color-scheme:dark}
/* single-look game worlds */
:root[data-g="show"]{--bg:#0c0620;--surface:#1a1036;--ink:#fdf6ff;--muted:#b8a8d8;--line:#3a2a66;--accent:#ff3df2;--accent-ink:#1a0018;--hi:#ffd400;--hi-ink:#221a00;--alarm:#ff4d6d;--ok:#3dffb0;--paper:#fff7e0;--paper-ink:#221;--glow:#ff3df288;--f-display:"Lalezar","Bungee",sans-serif;color-scheme:dark}
:root[data-g="pharaoh"]{--bg:#1d140a;--surface:#2b1f10;--ink:#f6e7c8;--muted:#c4a97a;--line:#55401f;--accent:#e0a530;--accent-ink:#1d140a;--hi:#3fb6c8;--hi-ink:#06232a;--alarm:#ff6a4d;--ok:#8fd16a;--paper:#ead7a8;--paper-ink:#3a2a10;--glow:#e0a53088;--f-display:"Reem Kufi","Lalezar",sans-serif;color-scheme:dark}
:root[data-g="priest"]{--bg:#0b1210;--surface:#14201c;--ink:#e3efe6;--muted:#93ab9e;--line:#2a3d36;--accent:#7be0b0;--accent-ink:#06150f;--hi:#c9a0ff;--hi-ink:#1b0b33;--alarm:#ff5c5c;--ok:#7be0b0;--paper:#d9cfb4;--paper-ink:#2a2416;--glow:#7be0b066;--f-display:"Reem Kufi","Lalezar",sans-serif;color-scheme:dark}
:root[data-g="cake"]{--bg:#fff1f4;--surface:#ffffff;--ink:#3a1626;--muted:#8a5d70;--line:#f2c6d3;--accent:#e2457a;--accent-ink:#fff;--hi:#ffd23f;--hi-ink:#3a2a00;--alarm:#d7263d;--ok:#1f8a4c;--paper:#fffaf0;--paper-ink:#3a1626;--glow:#e2457a55;--f-display:"Baloo Bhaijaan 2","Lalezar",sans-serif}
@media (prefers-color-scheme: dark){:root[data-g="cake"]:not([data-theme="light"]){--bg:#22101a;--surface:#2f1724;--ink:#ffe8f0;--muted:#d29bb2;--line:#4d2638;--accent:#ff6fa0;--accent-ink:#2a0614;--paper:#fff4ea;--paper-ink:#3a1626;color-scheme:dark}}
:root[data-g="cake"][data-theme="dark"]{--bg:#22101a;--surface:#2f1724;--ink:#ffe8f0;--muted:#d29bb2;--line:#4d2638;--accent:#ff6fa0;--accent-ink:#2a0614;--paper:#fff4ea;--paper-ink:#3a1626;color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;transition:background .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
:root[data-g="show"] body{background:radial-gradient(1200px 600px at 50% -10%,#3a1170 0,transparent 60%),var(--bg)}
:root[data-g="pharaoh"] body{background:radial-gradient(900px 500px at 50% -5%,#4a3315 0,transparent 65%),var(--bg)}
:root[data-g="priest"] body{background:radial-gradient(900px 500px at 50% -5%,#1d3a30 0,transparent 65%),var(--bg)}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.3;text-wrap:balance;margin:0}
:root[data-g="pharaoh"] h1,:root[data-g="pharaoh"] h2,:root[data-g="priest"] h1,:root[data-g="priest"] h2{font-weight:700}
h1{font-size:clamp(2.1rem,6vw,3.4rem)}
h2{font-size:clamp(1.5rem,4vw,2.1rem)}
h3{font-size:1.25rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{appearance:none;border:0;cursor:pointer;border-radius:10px;padding:.65em 1.3em;font-weight:700;background:var(--accent);color:var(--accent-ink);transition:transform .1s,filter .15s,box-shadow .2s;text-decoration:none;display:inline-flex;align-items:center;gap:.4em;justify-content:center}
.btn:hover{filter:brightness(1.08);box-shadow:0 0 0 4px var(--glow)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.big{font-size:1.12rem;padding:.8em 1.8em}
.btn.sm{padding:.35em .9em;font-size:.85rem}
.btn.danger{background:var(--alarm);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.field{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:.6em .9em;min-width:0}
.field:focus{border-color:var(--accent);outline:none}
.ltr{direction:ltr;unicode-bidi:isolate}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.eyebrow{font-size:.8rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
.lead{font-size:1.08rem;max-width:64ch}
.msg{min-height:1.6em;font-weight:700}
.msg.err{color:var(--alarm)}
.msg.good{color:var(--ok)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.scene-in{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{transform:perspective(900px) rotateX(8deg) translateY(14px);opacity:.3}to{transform:none;opacity:1}}

/* ---------- HOME ---------- */
.home-hero{display:flex;gap:26px;align-items:center;flex-wrap:wrap;padding-block:28px 8px}
.home-hero .txt{display:flex;flex-direction:column;gap:8px;flex:1;min-width:240px}
.brand{width:156px;flex:none;animation:bob 4s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(18,58,99,.25))}
.brand svg,.hud-logo svg{display:block;width:100%;height:auto}
@keyframes bob{50%{transform:translateY(-7px) rotate(-3deg)}}
.hud-logo{width:38px;flex:none;display:block;transition:transform .3s}
.hud-logo:hover{transform:rotate(-10deg) scale(1.1)}
.pond{display:block;width:100%;height:26px;color:var(--accent);opacity:.5}
.pond path{animation:pond 7s linear infinite}
@keyframes pond{to{transform:translateX(-80px)}}
.home-hero h1{font-size:clamp(2.6rem,8vw,4.6rem)}
.doors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;perspective:1400px;margin-block:20px}
.door-card{position:relative;border-radius:14px 14px 4px 4px;overflow:hidden;cursor:pointer;text-decoration:none;color:#fff;display:flex;flex-direction:column;min-height:330px;
  background:var(--dc,#333);box-shadow:var(--shadow);transform-origin:right center;transition:transform .6s cubic-bezier(.2,.8,.2,1),box-shadow .3s;transform-style:preserve-3d;border:3px solid #0003}
.door-card:hover,.door-card:focus-visible{transform:rotateY(-14deg) translateZ(10px);box-shadow:-18px 18px 40px rgba(0,0,0,.35)}
.door-card .art{flex:1;display:grid;place-items:center;padding:14px;background:linear-gradient(180deg,#ffffff14,transparent)}
.door-card .art svg{width:100%;max-width:150px;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.door-card .info{padding:14px;background:#00000052;display:flex;flex-direction:column;gap:4px}
.door-card h3{font-size:1.25rem;color:#fff}
.door-card .tag{font-size:.82rem;opacity:.9;line-height:1.5}
.door-card .meta{display:flex;gap:10px;font-size:.78rem;opacity:.85;flex-wrap:wrap}
.door-card .knob{position:absolute;top:52%;left:12px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c8,#c9a43c 60%,#7a5d16);box-shadow:0 2px 4px #0006}
.diff{display:inline-flex;gap:3px;align-items:center}
.diff i{width:7px;height:7px;border-radius:50%;background:#fff6;display:inline-block}
.diff i.on{background:#ffe066}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.how div{border-top:3px solid var(--line);padding-top:8px}
.how b{display:block}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:22px}
.hud-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.hud-l{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.hud .gname{font-family:var(--f-display);font-size:1.15rem}
.gcode{font-family:var(--f-mono);font-size:.85rem;border:1.5px dashed var(--line);border-radius:6px;padding:0 .5em}
.clock{font-family:var(--f-mono);font-weight:700;font-size:1.6rem;letter-spacing:.04em;padding:.05em .55em;border-radius:8px;background:var(--surface);border:1.5px solid var(--line);direction:ltr}
.clock.warn{color:var(--alarm);border-color:var(--alarm);animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{opacity:.55}}
.track{display:flex;gap:6px;align-items:center;font-size:.82rem;flex-wrap:wrap}
.track span{padding:.1em .7em;border-radius:99px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.track span.on{background:var(--hi);color:var(--hi-ink);border-color:var(--hi);font-weight:700}
.track span.done{color:var(--ok);border-color:var(--ok)}
.hud-r{display:flex;gap:8px;align-items:center}
.bagbtn{position:relative}
.bagbtn .n{position:absolute;top:-6px;left:-6px;background:var(--hi);color:var(--hi-ink);border-radius:99px;font-size:.72rem;min-width:1.4em;height:1.4em;display:grid;place-items:center;font-weight:700}
.bagbtn.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25) rotate(-6deg)}}

/* ---------- ROOM FRAME ---------- */
.room-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.goal{display:flex;gap:12px;align-items:flex-start;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 18px}
.goal b{font-family:var(--f-display);font-weight:400;font-size:1.1rem;white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:24px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);display:flex;flex-direction:column;gap:12px}
.bag{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:14px;box-shadow:var(--shadow)}
.bag h3{font-size:1.05rem;margin-bottom:8px;color:var(--paper-ink)}
.bag-list{display:flex;flex-direction:column;gap:6px}
.bag-list button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;background:#0000000d;font-size:.9rem}
.bag-list button:hover,.bag-list button:focus-visible{background:#00000018}
.bag-list button i{font-style:normal;width:22px;height:22px;display:grid;place-items:center;border-radius:4px;background:#0000001a;font-size:.8rem;flex:none}
.bag .empty{font-size:.88rem;opacity:.75}

/* ---------- SCENES ---------- */
.scene{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:12px;perspective:900px}
.spot{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;background:var(--surface);cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:132px;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .3s;transform-style:preserve-3d}
.spot:hover,.spot:focus-visible{transform:rotateX(10deg) translateY(-4px);border-color:var(--accent);box-shadow:0 14px 22px -12px var(--glow)}
.spot svg{width:100%;max-width:84px;height:auto}
.spot .lbl{font-size:.85rem;font-weight:700}
.spot.found{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.spot.found::after{content:"✓";position:absolute;top:6px;left:8px;color:var(--ok);font-weight:700}
.spot.empty{opacity:.55}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:40;box-shadow:var(--shadow);max-width:min(520px,calc(100% - 32px));text-align:center;animation:toast .3s}
@keyframes toast{from{transform:translate(-50%,20px);opacity:0}}

/* paper card */
.card{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:16px 18px;box-shadow:var(--shadow);position:relative}
.card.tape::before{content:"";position:absolute;top:-9px;right:50%;width:80px;height:18px;background:#ffe06699;transform:translateX(50%) rotate(-2deg)}
.card table{border-collapse:collapse;width:100%}
.card td{padding:3px 6px;border-bottom:1px dotted #0003}
.card .hand{font-family:var(--f-hand);font-size:1.15rem;line-height:1.7}

/* keypad / lock */
.lock{display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);width:fit-content;max-width:100%}
.lock .disp{display:flex;gap:6px;direction:ltr}
.lock .disp span{width:42px;height:52px;border-radius:8px;background:var(--bg);border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:1.5rem;font-weight:700;transition:transform .2s}
.lock .disp span.f{border-color:var(--accent);transform:translateY(-2px)}
.lock .keys{display:grid;grid-template-columns:repeat(3,52px);gap:7px;direction:ltr}
.lock .keys button{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-family:var(--f-mono);font-weight:700;font-size:1.05rem;cursor:pointer}
.lock .keys button:hover{border-color:var(--accent)}
.lock .keys .go{background:var(--ok);color:#fff;border-color:var(--ok)}
.lock .keys .clr{color:var(--alarm)}
.lock.open .disp span{border-color:var(--ok);color:var(--ok)}

/* ---------- 3D: hint cards ---------- */
.hints{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px dashed var(--line)}
.hint-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;perspective:1000px}
.hcard{position:relative;min-height:128px;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.4,.4,1);cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
.hcard.open{transform:rotateY(180deg);cursor:default}
.hcard:disabled{cursor:not-allowed}
.hcard .face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px;text-align:center}
.hcard .back{background:repeating-linear-gradient(45deg,var(--surface) 0 10px,color-mix(in srgb,var(--accent) 14%,var(--surface)) 10px 20px);border:1.5px solid var(--line)}
.hcard .back b{font-family:var(--f-display);font-size:2rem;color:var(--accent)}
.hcard .back small{color:var(--muted);font-size:.78rem}
.hcard:not(:disabled):not(.open):hover .back{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.hcard .front{transform:rotateY(180deg);background:color-mix(in srgb,var(--hi) 22%,var(--surface));border:1.5px solid var(--hi);font-size:.95rem;line-height:1.6;overflow:auto}
.hcard.cubey{min-height:190px}
/* 3D rotating prism (used inside some hints & clue reveals) */
.prism{width:120px;height:120px;position:relative;transform-style:preserve-3d;animation:spin 9s linear infinite;margin:6px auto}
.prism > div{position:absolute;inset:0;display:grid;place-items:center;border:2px solid var(--hi);background:color-mix(in srgb,var(--hi) 18%,var(--surface));font-weight:700;font-size:1rem;text-align:center;padding:6px;backface-visibility:visible}
.prism > div:nth-child(1){transform:rotateY(0deg) translateZ(60px)}
.prism > div:nth-child(2){transform:rotateY(90deg) translateZ(60px)}
.prism > div:nth-child(3){transform:rotateY(180deg) translateZ(60px)}
.prism > div:nth-child(4){transform:rotateY(270deg) translateZ(60px)}
.prism.sm{width:84px;height:84px}
.prism.sm > div:nth-child(1){transform:rotateY(0deg) translateZ(42px)}
.prism.sm > div:nth-child(2){transform:rotateY(90deg) translateZ(42px)}
.prism.sm > div:nth-child(3){transform:rotateY(180deg) translateZ(42px)}
.prism.sm > div:nth-child(4){transform:rotateY(270deg) translateZ(42px)}
@keyframes spin{from{transform:rotateX(-14deg) rotateY(0)}to{transform:rotateX(-14deg) rotateY(-360deg)}}
.stage3d{perspective:700px;padding:6px}

/* ---------- 3D: reveal / doors / drawers ---------- */
.flipin{animation:flipin .8s cubic-bezier(.2,.9,.3,1.2)}
@keyframes flipin{from{transform:perspective(800px) rotateY(-100deg);opacity:0}to{transform:none;opacity:1}}
.dropin{animation:dropin .7s cubic-bezier(.2,.9,.3,1.3)}
@keyframes dropin{from{transform:perspective(800px) translateZ(220px) rotateX(40deg);opacity:0}}
.swing{perspective:900px}
.swing .leaf{transform-origin:right center;transition:transform 1.4s cubic-bezier(.4,.1,.2,1)}
.swing.open .leaf{transform:rotateY(-105deg)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:#0009;backdrop-filter:blur(3px)}
.modal .box{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px;max-width:min(560px,100%);max-height:86vh;overflow:auto;box-shadow:0 30px 60px rgba(0,0,0,.4);animation:flipin .6s cubic-bezier(.2,.9,.3,1.2);display:flex;flex-direction:column;gap:14px;width:100%}
.modal .box h3{font-size:1.3rem}
.voice{display:flex;gap:14px;align-items:flex-start}
.voice .av{flex:none;width:64px;height:64px;border-radius:50%;background:var(--hi);color:var(--hi-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:1.8rem;box-shadow:0 0 0 4px var(--glow);animation:talk 1.2s ease-in-out 3}
@keyframes talk{50%{transform:scale(1.08) rotate(-3deg)}}
.voice .say{font-size:1.1rem;line-height:1.7}
.voice .who{font-size:.8rem;color:var(--muted);font-weight:700}

/* end */
.end{text-align:center;padding-block:28px;display:flex;flex-direction:column;align-items:center;gap:18px}
.end .big{font-family:var(--f-mono);font-size:clamp(2.4rem,9vw,4rem);font-weight:700;direction:ltr}
.trophy{font-family:var(--f-display);font-size:1.3rem;background:var(--hi);color:var(--hi-ink);padding:.2em 1em;border-radius:6px;transform:rotate(-2deg)}
.stats{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:1.4rem;font-variant-numeric:tabular-nums}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* setup */
.setup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.setup label{display:flex;flex-direction:column;gap:6px;font-weight:500;min-width:0}
.players{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:var(--surface)}
.mode:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.mode input{margin-top:.4em;accent-color:var(--accent)}
.mode b{display:block}
.story{font-size:1.1rem;line-height:1.9;max-width:62ch}
.intro-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center}
.intro-grid .art svg{width:100%;max-width:300px;height:auto;display:block;margin:auto;filter:drop-shadow(0 14px 24px rgba(0,0,0,.35))}
.float{animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(-1.5deg)}}

/* leaderboard */
.board{width:100%;text-align:start}
.board-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden;font-size:.85rem;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:.3em .9em;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tbl th{font-size:.78rem;color:var(--muted);font-weight:700;text-align:start;padding:6px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.t{white-space:normal;font-weight:700;min-width:8em}
.tbl tr.me td{background:color-mix(in srgb,var(--hi) 30%,transparent)}
.tbl tr.out td{color:var(--muted)}
.rank{display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;border:1.5px solid var(--line);font-family:var(--f-mono);font-weight:700;font-size:.85rem}
.rank.r1{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.board-empty{padding:18px;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
.board-note{font-size:.85rem;color:var(--muted);margin-top:8px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}


/* ---------- FX layer ---------- */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%}
.wrap{position:relative;z-index:1}
.hud{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#vig{position:fixed;inset:0;z-index:65;pointer-events:none}
#vig.bad{animation:vigBad .5s}
#vig.good{animation:vigGood .9s}
#vig.low{animation:vigLow 1.4s ease-in-out infinite}
@keyframes vigBad{30%{box-shadow:inset 0 0 120px 20px #ff1f3daa}}
@keyframes vigGood{30%{box-shadow:inset 0 0 140px 10px #3dffb088}}
@keyframes vigLow{50%{box-shadow:inset 0 0 90px 0 #ff1f3d55}}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#ffffff66 50%,transparent 65%);transform:translateX(-130%);pointer-events:none}
.btn:not(:disabled):hover::after{transform:translateX(130%);transition:transform .8s}
.bagbtn{overflow:visible}.bagbtn::after{display:none}
.btn.big:not(.ghost){animation:breath 2.6s ease-in-out infinite}
@keyframes breath{50%{box-shadow:0 0 0 8px var(--glow)}}
/* home */
.home-hero h1{background:linear-gradient(90deg,var(--ink) 20%,var(--accent) 50%,var(--ink) 80%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 7s linear infinite}
@keyframes shim{to{background-position:-220% 0}}
.doors .door-card{animation:doorIn .8s cubic-bezier(.2,.9,.3,1.1) backwards}
.doors .door-card:nth-child(2){animation-delay:.08s}.doors .door-card:nth-child(3){animation-delay:.16s}.doors .door-card:nth-child(4){animation-delay:.24s}.doors .door-card:nth-child(5){animation-delay:.32s}
@keyframes doorIn{from{transform:rotateY(70deg) translateY(40px);opacity:0}}
.door-card::before{content:"";position:absolute;left:8%;right:8%;bottom:-2px;height:10px;border-radius:50%;background:#fff8c8;filter:blur(8px);opacity:.55;animation:underdoor 3s ease-in-out infinite;z-index:2}
@keyframes underdoor{50%{opacity:1;filter:blur(12px)}}
.door-card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,#ffffff2e 50%,transparent 60%);transform:translateX(-120%);pointer-events:none}
.door-card:hover::after{transform:translateX(120%);transition:transform .9s}
.door-card:hover,.door-card:focus-visible{transform:rotateY(calc(-10deg + var(--ry,0deg))) rotateX(var(--rx,0deg)) translateZ(14px)}
.door-card .art svg{transition:transform .5s cubic-bezier(.2,.9,.3,1.3)}
.door-card:hover .art svg{transform:translateY(-8px) scale(1.07) rotate(-2deg)}
.door-card.opening{transform:rotateY(-80deg) translateZ(20px)!important;transition:transform .55s ease-in;box-shadow:-60px 0 80px #fff8c855}
/* rooms */
.room-scene .spot{animation:spotIn .5s cubic-bezier(.2,.9,.3,1.2) backwards}
.room-scene .spot:nth-child(2){animation-delay:.05s}.room-scene .spot:nth-child(3){animation-delay:.1s}.room-scene .spot:nth-child(4){animation-delay:.15s}.room-scene .spot:nth-child(5){animation-delay:.2s}.room-scene .spot:nth-child(6){animation-delay:.25s}.room-scene .spot:nth-child(7){animation-delay:.3s}.room-scene .spot:nth-child(8){animation-delay:.35s}
@keyframes spotIn{from{transform:translateY(24px) rotateX(-50deg);opacity:0}}
.quiet .spot,.quiet .photo,.quiet .sh-w,.quiet .digits4 span,.quiet .ph-grid .ph-sym{animation:none!important}
.spot{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 7%,var(--surface)),var(--surface))}
.spot:hover,.spot:focus-visible{transform:rotateX(var(--rx,8deg)) rotateY(var(--ry,0deg)) translateY(-5px) scale(1.04)}
.spot > span:first-child,.spot > svg{transition:transform .35s cubic-bezier(.2,.9,.3,1.4);transform:translateZ(0)}
.spot:hover > span:first-child,.spot:hover > svg{transform:translateZ(30px) scale(1.15)}
.spot.found{animation:foundPop .5s}
@keyframes foundPop{40%{transform:scale(1.12) rotateY(14deg)}}
.goal{position:relative;overflow:hidden}
.goal::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,#ffffff22 50%,transparent 60%);animation:goalShine 5s ease-in-out infinite}
@keyframes goalShine{0%,60%{transform:translateX(120%)}100%{transform:translateX(-120%)}}
.lock .disp span.f{animation:digit .25s cubic-bezier(.2,.9,.3,1.6)}
@keyframes digit{from{transform:translateY(-14px) rotateX(80deg);opacity:0}}
.lock.open{animation:lockOk .8s}
@keyframes lockOk{40%{box-shadow:0 0 0 10px #3dffb055,var(--shadow);transform:scale(1.04)}}
.modal .card{overflow:hidden}
.modal .card::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,#ffffff88 50%,transparent 60%);transform:translateX(130%);animation:cardShine 1.1s .35s forwards;pointer-events:none}
@keyframes cardShine{to{transform:translateX(-130%)}}
.hcard.next .back b{animation:hintBob 2s ease-in-out infinite}
@keyframes hintBob{50%{transform:translateY(-5px) scale(1.1)}}
.hcard.nudge .back{box-shadow:0 0 0 5px var(--glow);border-color:var(--hi)}
/* curtain between rooms */
.curtain{position:fixed;inset:0;z-index:70;display:grid;place-items:center;overflow:hidden}
.curtain i{position:absolute;top:0;bottom:0;width:50.5%;background:var(--ink);box-shadow:0 0 60px #000a}
.curtain i:first-child{left:0;animation:curL 1.7s cubic-bezier(.7,0,.3,1) both}
.curtain i:nth-child(2){right:0;animation:curR 1.7s cubic-bezier(.7,0,.3,1) both}
.curtain div{position:relative;color:var(--bg);text-align:center;animation:curT 1.7s both;padding:20px}
.curtain small{display:block;letter-spacing:.3em;opacity:.7;font-size:.85rem}
.curtain b{font-family:var(--f-display);font-size:clamp(2rem,7vw,3.6rem);font-weight:400;display:block}
.curtain em{display:block;width:120px;height:3px;background:var(--hi);margin:10px auto 0;animation:curBar 1.7s both}
@keyframes curL{0%{transform:translateX(-101%)}30%,70%{transform:none}100%{transform:translateX(-101%)}}
@keyframes curR{0%{transform:translateX(101%)}30%,70%{transform:none}100%{transform:translateX(101%)}}
@keyframes curT{0%,25%{opacity:0;transform:scale(.8)}40%,65%{opacity:1;transform:none}80%,100%{opacity:0;transform:scale(1.15)}}
@keyframes curBar{0%,30%{transform:scaleX(0)}60%{transform:scaleX(1)}}
/* intro + end */
.title-in span{display:inline-block;animation:wordIn .8s cubic-bezier(.2,.9,.3,1.2) backwards}
@keyframes wordIn{from{transform:translateY(40px) rotateX(-80deg);opacity:0}}
.intro-grid .art{position:relative}
.intro-grid .art::before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 65%);animation:halo 3.5s ease-in-out infinite;z-index:-1}
@keyframes halo{50%{transform:scale(1.25);opacity:.6}}
.end{position:relative}
.end.won::before{content:"";position:absolute;top:-80px;left:50%;width:560px;height:560px;margin-left:-280px;border-radius:50%;background:repeating-conic-gradient(from 0deg,var(--glow) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 68%);mask:radial-gradient(circle,#000 0,transparent 68%);animation:rays 40s linear infinite;z-index:-1;opacity:.7;max-width:100vw}
@keyframes rays{to{transform:rotate(360deg)}}
.end .trophy{animation:trophy 1s cubic-bezier(.2,.9,.3,1.5) backwards}
@keyframes trophy{from{transform:scale(0) rotate(-30deg)}}
.end .big{animation:dropin .9s .3s backwards}
.burst{position:fixed;z-index:66;pointer-events:none;width:8px;height:8px;border-radius:2px}
/* ---------- chat ---------- */
.chatfab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;border:0;border-radius:99px;padding:.6em 1.2em;font-weight:700;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:var(--shadow)}
.chatfab .n{position:absolute;top:-6px;right:-6px;background:var(--alarm);color:#fff;border-radius:99px;min-width:1.5em;height:1.5em;display:grid;place-items:center;font-size:.75rem}
.chat{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:46;width:min(340px,calc(100vw - 32px));height:min(460px,70vh);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;animation:chatIn .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes chatIn{from{transform:translateY(30px) scale(.9);opacity:0}}
.chat header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--ink);color:var(--bg)}
.chat header button{all:unset;cursor:pointer;font-size:1.2rem;padding:0 6px}
.chat .list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.chat .m{max-width:85%;background:var(--bg);border-radius:12px;border-start-start-radius:3px;padding:6px 10px;align-self:flex-start;animation:msgIn .25s}
.chat .m.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-radius:12px;border-end-end-radius:3px}
.chat .m small{display:block;font-size:.72rem;opacity:.75;font-weight:700}
.chat .m span{overflow-wrap:anywhere}
@keyframes msgIn{from{transform:translateY(8px);opacity:0}}
.chat form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.chat form input{flex:1}
.chat .empty{color:var(--muted);text-align:center;margin:auto;font-size:.9rem}

/* ---------- illustrated room scenes ---------- */
.room-scene{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);perspective:900px;isolation:isolate}
.room-scene .bg{position:absolute;inset:-3%;z-index:-1;transform:translate(calc(var(--px,0)*-10px),calc(var(--py,0)*-7px));transition:transform .25s ease-out}
.room-scene .bg::before,.room-scene .bg::after{content:"";position:absolute;inset:0;pointer-events:none}
.room-scene .chip{position:absolute;top:10px;inset-inline-start:12px;z-index:3;background:#000b;color:#fff;border-radius:99px;padding:.1em .9em;font-size:.85rem;font-weight:700;backdrop-filter:blur(4px)}
.room-scene .spot{position:absolute;translate:-50% -50%;border:0;background:none;padding:4px;min-height:0;gap:4px;box-shadow:none;z-index:1}
.room-scene .spot:hover,.room-scene .spot:focus-visible{box-shadow:none;z-index:2}
.room-scene .spot.found{background:none}
.room-scene .spot.found::after{display:none}
.room-scene .spot .art{font-size:clamp(2.1rem,6vw,3.6rem);line-height:1.1;display:grid;place-items:center;filter:drop-shadow(0 9px 6px rgba(0,0,0,.4));rotate:var(--rot,0deg)}
.room-scene .spot .art svg{width:clamp(54px,10vw,100px);max-width:none}
.room-scene .spot .lbl{background:#000b;color:#fff;border-radius:99px;padding:0 .7em;font-size:.72rem;white-space:nowrap;backdrop-filter:blur(4px)}
.room-scene .spot::before{content:"🔍";position:absolute;top:-4px;inset-inline-end:-4px;width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:.72rem;box-shadow:0 2px 6px #0007;z-index:2;animation:ping 2.6s ease-out infinite}
.room-scene .spot:nth-child(odd)::before{animation-delay:1.1s}
@keyframes ping{0%{box-shadow:0 0 0 0 #ffffffaa,0 2px 6px #0007}60%,100%{box-shadow:0 0 0 12px #fff0,0 2px 6px #0007}}
.room-scene .spot.found::before{content:"✓";background:var(--ok);color:#fff;font-weight:700;animation:none}
.room-scene .spot.empty::before{content:"×";background:#0008;color:#fff;animation:none}
.bg-office .bg{background:linear-gradient(180deg,#7f9ed0,#4e6ea9) top/100% 48% no-repeat,repeating-linear-gradient(90deg,#d6a56f 0 46px,#c9965f 46px 48px)}
.bg-office .bg::before{background:radial-gradient(60% 40% at 30% 0,#ffffff3a,transparent 70%),linear-gradient(180deg,transparent 47.4%,#0004 47.6%,transparent 52%)}
.bg-office .bg::after{inset:86% 0 0;background:repeating-linear-gradient(90deg,#a8733e 0 31%,#7c4f25 31% 33.33%);box-shadow:0 -6px 12px #0005;border-top:3px solid #8a5a2c}
.bg-show .bg{background:repeating-linear-gradient(90deg,#8a0f45 0 34px,#650a35 34px 68px) top/100% 60% no-repeat,linear-gradient(#4a2d14,#1c1007)}
.bg-show .bg::before{background:conic-gradient(from 160deg at 22% -5%,transparent 0 8deg,#ffd4002e 14deg,transparent 22deg),conic-gradient(from 170deg at 78% -5%,transparent 0 8deg,#3dffb02a 14deg,transparent 22deg),linear-gradient(180deg,transparent 59%,#000a 60%,transparent 66%);animation:sweep 6s ease-in-out infinite alternate}
.bg-show .bg::after{inset:0 0 88%;background:repeating-linear-gradient(90deg,#ffd400 0 14px,#b88f00 14px 28px);border-radius:0 0 50% 50%/0 0 100% 100%;opacity:.9}
.bg-pharaoh .bg{background:repeating-linear-gradient(0deg,transparent 0 40px,#8a6a3877 40px 42px) top/100% 58% no-repeat,repeating-linear-gradient(90deg,transparent 0 84px,#8a6a3877 84px 86px) top/100% 58% no-repeat,linear-gradient(#c59f5c,#a8814a) top/100% 58% no-repeat,linear-gradient(#7a5f33,#4d3a1c)}
.bg-pharaoh .bg::before{background:radial-gradient(30% 45% at 6% 30%,#ff9d2e66,transparent 70%),radial-gradient(30% 45% at 94% 30%,#ff9d2e66,transparent 70%),radial-gradient(90% 90% at 50% 50%,transparent 50%,#0009);animation:torch 2.2s ease-in-out infinite alternate}
@keyframes torch{to{opacity:.72}}
.bg-pharaoh .bg::after{background:linear-gradient(90deg,#6e5630 0 5%,transparent 5% 95%,#6e5630 95%);opacity:.8}
.bg-priest .bg{background:repeating-linear-gradient(0deg,transparent 0 46px,#0006 46px 48px) top/100% 60% no-repeat,repeating-linear-gradient(90deg,transparent 0 92px,#0006 92px 94px) top/100% 60% no-repeat,linear-gradient(#24352f,#16221e) top/100% 60% no-repeat,linear-gradient(#10100f,#060807)}
.bg-priest .bg::before{background:radial-gradient(40% 55% at 50% 38%,#7be0b044,transparent 70%),radial-gradient(100% 100% at 50% 50%,transparent 40%,#000c);animation:torch 3.5s ease-in-out infinite alternate}
.bg-priest .bg::after{inset:70% 0 0;background:linear-gradient(transparent,#c9a0ff22);filter:blur(10px)}
.bg-cake .bg{background:radial-gradient(#ffffffaa 12%,transparent 13%) 0 0/34px 34px,linear-gradient(#ffd3e0,#ffbfd2) top/100% 58% no-repeat;background-color:#e3b98a}
.bg-cake .bg::before{background:repeating-linear-gradient(90deg,#d9a877 0 58px,#cf9c69 58px 60px);inset:58% 0 0;box-shadow:0 -4px 10px #0003}
.bg-cake .bg::after{inset:0 0 86%;background:repeating-linear-gradient(110deg,#e2457a 0 22px,#ffd23f 22px 44px,#5ac8fa 44px 66px,#7be0b0 66px 88px);clip-path:polygon(0 0,100% 0,100% 35%,97% 100%,94% 35%,91% 100%,88% 35%,85% 100%,82% 35%,79% 100%,76% 35%,73% 100%,70% 35%,67% 100%,64% 35%,61% 100%,58% 35%,55% 100%,52% 35%,49% 100%,46% 35%,43% 100%,40% 35%,37% 100%,34% 35%,31% 100%,28% 35%,25% 100%,22% 35%,19% 100%,16% 35%,13% 100%,10% 35%,7% 100%,4% 35%,1% 100%,0 35%)}
.bg-cake.r2 .bg{background:linear-gradient(#fff 0 0) 0 0/100% 2px,repeating-linear-gradient(0deg,transparent 0 38px,#b7d3e0 38px 40px) top/100% 58% no-repeat,repeating-linear-gradient(90deg,transparent 0 38px,#b7d3e0 38px 40px) top/100% 58% no-repeat,linear-gradient(#eef8fc,#dcedf4) top/100% 58% no-repeat;background-color:#e3b98a}
.bg-cake.r2 .bg::after{display:none}
@media (max-width:700px){.room-scene{aspect-ratio:4/3.4}.room-scene .spot .lbl{font-size:.62rem}.room-scene .spot::before{width:20px;height:20px}}

/* ---------- stars, difficulty, tournament ---------- */
.stars{display:inline-flex;gap:2px;direction:ltr}
.stars i{font-style:normal;color:#ffffff55;font-size:1rem}
.stars i.on{color:#ffd23f;text-shadow:0 0 8px #ffd23f99}
.stars.big i{font-size:3rem;color:var(--line)}
.stars.big i.on{color:#ffc41f;animation:starPop .7s cubic-bezier(.2,.9,.3,1.8) backwards}
@keyframes starPop{from{transform:scale(0) rotate(-180deg);opacity:0}}
.badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.badges span{background:var(--surface);border:1.5px solid var(--hi);border-radius:99px;padding:.1em .9em;font-size:.88rem;font-weight:700}
.tick{color:var(--ok);font-weight:700}
/* ---------- characters + typed speech ---------- */
.chara{position:relative;width:76px;flex:none}
.chara svg{display:block;width:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.chara .hd{fill:var(--hi);stroke:var(--hi-ink);stroke-width:3}
.chara .eyes ellipse{fill:var(--hi-ink);transform-box:fill-box;transform-origin:center;animation:blinkE 4s infinite}
@keyframes blinkE{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.chara .mouth{fill:var(--hi-ink);transform-box:fill-box;transform-origin:center}
.chara.talking .mouth{animation:talkM .18s ease-in-out infinite alternate}
.chara.talking{animation:nod .5s ease-in-out infinite alternate}
@keyframes talkM{to{transform:scaleY(3.200) scaleX(.7)}}
@keyframes nod{to{transform:translateY(-3px) rotate(-2deg)}}
.chara .badge{position:absolute;bottom:-6px;inset-inline-end:-8px;font-size:1.5rem;filter:drop-shadow(0 2px 3px #0006)}
.voice .say{cursor:pointer;min-height:3.4em}
/* ---------- story intro ---------- */
.story-ov{position:fixed;inset:0;z-index:80;background:#000d;display:grid;place-items:center;padding:16px;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0}}
.story-card{width:min(720px,100%);display:flex;flex-direction:column;gap:14px;color:#fff}
.story-scene{aspect-ratio:16/8;border:2px solid #ffffff33}
.story-scene .bg{animation:kenburns 7s ease-out both}
@keyframes kenburns{from{transform:scale(1.25) translateY(3%)}to{transform:scale(1.02)}}
.story-art{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(3.500rem,13vw,6.500rem);filter:drop-shadow(0 14px 12px rgba(0,0,0,.5));animation:storyArt .9s cubic-bezier(.2,.9,.3,1.3) both,float 5s 1s ease-in-out infinite;letter-spacing:.1em}
@keyframes storyArt{from{transform:translateY(60px) scale(.5);opacity:0}}
.story-txt{font-size:1.25rem;line-height:1.8;min-height:3.6em;margin:0;text-align:center}

.hteam .rem{font-family:var(--f-mono);font-weight:700;font-size:1.5rem;direction:ltr}

.hteam .acts{display:flex;gap:6px;flex-wrap:wrap}
.hteam form{display:flex;gap:6px}
.pillst{font-size:.78rem;font-weight:700;border-radius:99px;padding:0 .7em;background:var(--hi);color:var(--hi-ink);white-space:nowrap}

.chat.draft header{background:#8a5a1f;color:#fff}
.chat.draft .list{background:repeating-linear-gradient(transparent 0 29px,#c9ced844 29px 30px),var(--paper);color:var(--paper-ink);gap:0;padding:6px 12px}
.chat .note{margin:0;padding:6px 12px;font-size:.75rem;background:#fff3c4;color:#4a3800}
.dl{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dotted #0003;animation:msgIn .25s}
.dl .dn{font-size:.72rem;font-weight:700;background:#0001;border-radius:99px;padding:0 .6em;flex:none;margin-top:3px}
.dl .dt{flex:1;overflow-wrap:anywhere;font-family:var(--f-hand);font-size:1.1rem;line-height:1.5}
.dl .dx{all:unset;cursor:pointer;opacity:.5;padding:0 6px;font-size:1.1rem}.dl .dx:hover,.dl .dx:focus-visible{opacity:1;color:var(--alarm)}

@media (max-width:980px){.doors{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.layout{grid-template-columns:1fr}.side{position:static}}

<script>
/* ===================== ENGINE ===================== */
window.OE=(function(){
const $=s=>document.querySelector(s);
const GAMES={}, ORDER=[];
const AR='٠١٢٣٤٥٦٧٨٩';
const digits=s=>String(s||'').replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/\D/g,'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function H(s){s='oe26|'+s;let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h.toString(36);}
const fmt=sec=>{sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')};
const clockTime=ms=>{const d=new Date(ms);return [d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':')};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a};
const RND={int:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick:a=>a[Math.floor(Math.random()*a.length)],shuffle,digits:(n,lo=1,hi=9)=>shuffle(Array.from({length:hi-lo+1},(_,i)=>lo+i)).slice(0,n)};

/* ---------- sound (synth, starts after a click) ---------- */
let ac=null;
function ctxA(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac;}catch(e){return null}}
function tone(f,t0,d,{type='sine',vol=.15,slide=0,attack=.01}={}){const a=ctxA();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);}
function noise(t0,d,{vol=.2,freq=1200,q=1,type='bandpass',decay=true}={}){const a=ctxA();if(!a)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(decay?Math.pow(1-i/n,2):1);
  const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=a.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+t0);}
const SFX={
  ok(){[660,880,1175].forEach((f,i)=>tone(f,i*.1,.2,{type:'triangle',vol:.12}))},
  bad(){tone(220,0,.18,{type:'square',vol:.08});tone(170,.13,.25,{type:'square',vol:.08})},
  click(){tone(900,0,.05,{type:'square',vol:.04})},
  find(){tone(1046,0,.12,{type:'triangle',vol:.1});tone(1568,.08,.2,{type:'triangle',vol:.08})},
  alarm(){for(let i=0;i<4;i++){tone(880,i*.22,.12,{type:'sawtooth',vol:.07});tone(660,i*.22+.11,.11,{type:'sawtooth',vol:.07})}},
  unlock(){noise(0,.06,{freq:3000,vol:.3});noise(.12,.08,{freq:1800,vol:.3});tone(523,.22,.3,{type:'triangle',vol:.1});tone(784,.3,.4,{type:'triangle',vol:.1})},
  magic(){[523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,i*.07,.5,{type:'sine',vol:.07}))},
  whoosh(){noise(0,.5,{freq:600,q:.7,vol:.25})},
  drum(){for(let i=0;i<16;i++)noise(i*.06,.05,{freq:200,q:.8,vol:.25});noise(1,.4,{freq:120,q:.5,vol:.5})},
  tada(){[523,659,784].forEach(f=>tone(f,0,.25,{type:'square',vol:.05}));[523,659,784,1046].forEach(f=>tone(f,.28,.7,{type:'square',vol:.05}))},
  bell(){[1318,1975,2637].forEach((f,i)=>tone(f,0,1.4,{type:'sine',vol:[.18,.07,.05][i],attack:.002}))},
  clap(){for(let i=0;i<9;i++)noise(i*.09+Math.random()*.03,.07,{freq:1600,q:.8,vol:.45})},
  laugh(){[0,1,2,3,4].forEach(i=>{tone(360-i*12,i*.16,.11,{type:'sawtooth',vol:.06,slide:-60});noise(i*.16,.1,{freq:900,q:2,vol:.12})})},
  door(){noise(0,.35,{freq:180,q:.6,vol:.9});tone(70,0,.3,{type:'sine',vol:.3,slide:-30})},
  horn(){tone(233,0,.6,{type:'sawtooth',vol:.08});tone(294,0,.6,{type:'sawtooth',vol:.06});tone(349,.0,.6,{type:'sawtooth',vol:.05})},
  meow(){tone(700,0,.5,{type:'sawtooth',vol:.05,slide:500});tone(1200,.25,.35,{type:'sawtooth',vol:.04,slide:-700})},
  wave(){noise(0,1.4,{freq:500,q:.4,vol:.35,decay:false});noise(.4,1.0,{freq:900,q:.4,vol:.2})},
  bird(){[0,.15,.3].forEach(t=>tone(3000,t,.1,{type:'sine',vol:.08,slide:1200}))},
  stone(){noise(0,.6,{freq:150,q:.5,vol:.6});tone(60,0,.5,{type:'triangle',vol:.2})},
  drip(){tone(1400,0,.12,{type:'sine',vol:.12,slide:-900})},

const AUD={};
function audInit(){['bell','clap','laugh','door','horn','meow','wave','bird'].forEach(n=>{try{const a=new Audio();a.preload='auto';a.addEventListener('canplaythrough',()=>{AUD[n]=a},{once:true});a.src='sounds/'+n+'.mp3';}catch(e){}});}
const sfx=n=>{try{if(AUD[n]){const a=AUD[n].cloneNode();a.volume=.85;a.play().catch(()=>{});}else SFX[n]&&SFX[n]()}catch(e){} if(n==='find'||n==='ok'||n==='magic')burst(); if(n==='unlock'||n==='tada')vig('good'); if(n==='bad'||n==='alarm')vig('bad');};

/* ---------- visual effects ---------- */
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastPt=[innerWidth/2,innerHeight/2],tiltEl=null;
document.addEventListener('pointerdown',e=>{lastPt=[e.clientX,e.clientY]},true);

  const sc=e.target.closest&&e.target.closest('.room-scene');if(sc&&!REDUCED){const b=sc.getBoundingClientRect();sc.style.setProperty('--px',(((e.clientX-b.left)/b.width-.5)*2).toFixed(2));sc.style.setProperty('--py',(((e.clientY-b.top)/b.height-.5)*2).toFixed(2));}
  tiltEl=el;if(!el||REDUCED)return;const r=el.getBoundingClientRect();
  el.style.setProperty('--ry',(((e.clientX-r.left)/r.width-.5)*18).toFixed(1)+'deg');el.style.setProperty('--rx',((.5-(e.clientY-r.top)/r.height)*18).toFixed(1)+'deg');
});
const SLOTS={3:[[20,40],[50,70],[80,40]],4:[[15,40],[40,72],[63,36],[86,70]],6:[[13,32],[46,26],[83,32],[22,74],[54,76],[85,72]],8:[[11,31],[35,24],[61,27],[87,32],[15,74],[39,78],[64,72],[88,76]]};
function slot(i,n){const a=SLOTS[n]||SLOTS[n<=4?4:n<=6?6:8],p=a[i%a.length];return `left:${p[0]}%;top:${p[1]}%;--rot:${(i*37)%9-4}deg`;}
function sceneOpen(bg,list,x){const seen=list.filter(s=>x.st['f_'+s.id]).length;return `<div class="room-scene ${bg} r${x.run.room}"><div class="bg"></div><span class="chip">🔍 <span class="cnt">${seen}</span>/${list.length}</span>`;}
document.addEventListener('click',e=>{const sp=e.target.closest&&e.target.closest('.room-scene .spot');if(!sp)return;const sc=sp.closest('.room-scene');setTimeout(()=>{const c=sc.querySelector('.cnt');if(c&&sc.isConnected)c.textContent=sc.querySelectorAll('.spot.found,.spot.empty').length;},30);});
function vig(k){const v=$('#vig');if(!v||REDUCED)return;v.classList.remove('bad','good');void v.offsetWidth;v.classList.add(k);}
function burst(){
  if(REDUCED)return;const cs=getComputedStyle(document.documentElement),cols=[cs.getPropertyValue('--hi'),cs.getPropertyValue('--accent'),'#ffffff'];
  for(let i=0;i<16;i++){const d=document.createElement('i');d.className='burst';d.style.left=lastPt[0]+'px';d.style.top=lastPt[1]+'px';d.style.background=cols[i%3];document.body.appendChild(d);
    const a=Math.random()*6.28,r=50+Math.random()*90;
    d.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r+30}px) rotate(${Math.random()*540}deg) scale(.2)`,opacity:0}],{duration:650+Math.random()*350,easing:'cubic-bezier(.1,.8,.3,1)'}).onfinish=()=>d.remove();}
}
function curtain(small,title,mid){
  if(REDUCED){mid();return;}
  const c=document.createElement('div');c.className='curtain';c.setAttribute('dir','rtl');c.innerHTML=`<i></i><i></i><div><small>${esc(small)}</small><b>${esc(title)}</b><em></em></div>`;document.body.appendChild(c);
  sfx('door');setTimeout(mid,640);setTimeout(()=>c.remove(),1750);
}
const FX=(()=>{
  const c=document.getElementById('fx'),x=c.getContext('2d');let P=[],theme=null,raf=0,W=0,HH=0;
  const CFG={home:{n:34,kind:'bokeh',cols:['#4a9ad4','#f5a623','#6bb6e6','#1f6fb5']},office:{n:22,kind:'paper',cols:['#1f6fb5','#f5a623','#8aa3ba']},show:{n:70,kind:'spark',cols:['#ff3df2','#ffd400','#3dffb0','#ffffff']},
    pharaoh:{n:110,kind:'sand',cols:['#e0a530','#f6e7c8','#c08a20']},priest:{n:30,kind:'fly',cols:['#7be0b0','#c9a0ff']},cake:{n:46,kind:'sprinkle',cols:['#e2457a','#ffb400','#5ac8fa','#3fbf7f','#b06cff']}};
  const size=()=>{W=c.width=innerWidth;HH=c.height=innerHeight};size();addEventListener('resize',size);
  function loop(){raf=requestAnimationFrame(loop);if(document.hidden)return;const cfg=CFG[theme],t=performance.now()/1000;x.clearRect(0,0,W,HH);
    for(const p of P){x.save();x.fillStyle=p.c;
      if(cfg.kind==='bokeh'){p.y-=p.s*.18;p.x+=Math.sin(t*.2+p.a)*.15;x.globalAlpha=.07;x.beginPath();x.arc(p.x,p.y,24+p.r*70,0,6.28);x.fill();}
      else if(cfg.kind==='paper'){p.y+=p.s*.3;p.x+=Math.sin(t*.4+p.a)*.4;x.globalAlpha=.11;x.translate(p.x,p.y);x.rotate(p.a+t*.25*p.s);x.fillRect(-9,-12,18,24);}
      else if(cfg.kind==='spark'){p.y-=p.s*.12;const al=(Math.sin(t*2.2*p.s+p.a)+1)/2;x.globalAlpha=al*.8;const z=1+p.r*2.6;x.translate(p.x,p.y);x.beginPath();x.moveTo(0,-z*3);x.lineTo(z*.6,-z*.6);x.lineTo(z*3,0);x.lineTo(z*.6,z*.6);x.lineTo(0,z*3);x.lineTo(-z*.6,z*.6);x.lineTo(-z*3,0);x.lineTo(-z*.6,-z*.6);x.fill();}
      else if(cfg.kind==='sand'){p.x+=p.s*1.3;p.y+=p.s*.25+Math.sin(t+p.a)*.25;x.globalAlpha=.25+p.r*.35;x.fillRect(p.x,p.y,1+p.r*2,1+p.r);}
      else if(cfg.kind==='fly'){p.x+=Math.cos(t*.4*p.s+p.a)*.6;p.y+=Math.sin(t*.5*p.s+p.a*2)*.5-.05;const R=8+p.r*14,g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,R);g.addColorStop(0,p.c);g.addColorStop(1,'transparent');x.globalAlpha=.25+(Math.sin(t*1.5*p.s+p.a)+1)/2*.55;x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,R,0,6.28);x.fill();}
      else{p.y+=p.s*.45;p.x+=Math.sin(t*.6+p.a)*.3;x.globalAlpha=.5;x.translate(p.x,p.y);x.rotate(p.a+t*.5*p.s);x.beginPath();x.roundRect?x.roundRect(-2,-6,4,12,2):x.rect(-2,-6,4,12);x.fill();}
      x.restore();
      if(p.y<-90)p.y=HH+80;if(p.y>HH+90)p.y=-80;if(p.x>W+90)p.x=-80;if(p.x<-90)p.x=W+80;}
  }

})();

/* ---------- state ---------- */
let S=null;      // current run
let tick=null;
const save=()=>{try{if(S)localStorage.setItem('oe-run',JSON.stringify(S));else localStorage.removeItem('oe-run');}catch(e){}};
const load=()=>{try{return JSON.parse(localStorage.getItem('oe-run')||'null')}catch(e){return null}};
function elapsed(){if(!S||!S.startedAt)return 0;const end=S.doneAt||S.pausedAt||Date.now();return Math.max(0,(end-S.startedAt)/1000+S.pen)}
function remaining(){return Math.max(0,S.minutes*60-elapsed())}
const G=()=>S&&GAMES[S.game];
function rooms(){const g=G();return g.roomsFor?g.roomsFor(S.opt||{}):g.rooms}

/* ---------- modal / toast / voice ---------- */
function modal(html,{onClose,btn='تمام'}={}){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="box">${html}<div class="row"><button class="btn" type="button" id="mClose">${btn}</button></div></div></div>`;
  const close=()=>{root.innerHTML='';document.removeEventListener('keydown',k);onClose&&onClose();};
  const k=e=>{if(e.key==='Escape')close();};
  document.addEventListener('keydown',k);
  $('#mClose').onclick=close; root.querySelector('.modal').onclick=e=>{if(e.target.classList.contains('modal'))close();};
  setTimeout(()=>{const b=$('#mClose');b&&b.focus({preventScroll:true})},50);
}
const CHARA='<svg viewBox="0 0 80 80" aria-hidden="true"><circle class="hd" cx="40" cy="40" r="36"/><g class="eyes"><ellipse cx="28" cy="34" rx="4" ry="5.500"/><ellipse cx="52" cy="34" rx="4" ry="5.500"/></g><ellipse class="mouth" cx="40" cy="55" rx="9" ry="2.600"/></svg>';
function typeInto(el,html,done){
  el.innerHTML=html;if(REDUCED){done&&done();return ()=>{};}
  const nodes=[],w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);while(w.nextNode())nodes.push([w.currentNode,w.currentNode.nodeValue]);
  nodes.forEach(n=>n[0].nodeValue='');let ni=0,ci=0,stop=false,k=0;
  const fin=()=>{if(stop)return;stop=true;nodes.forEach(n=>n[0].nodeValue=n[1]);done&&done();};
  (function step(){if(stop)return;if(!el.isConnected){stop=true;return;}if(ni>=nodes.length){stop=true;done&&done();return;}const n=nodes[ni];ci++;n[0].nodeValue=n[1].slice(0,ci);if(ci>=n[1].length){ni++;ci=0;}if(++k%3===0)tone(480+Math.random()*160,0,.03,{type:'square',vol:.012});setTimeout(step,24);})();
  return fin;
}
function voice(who,text,{av,onClose,btn}={}){
  let h=0;for(const c of who)h=(h*31+c.charCodeAt(0))%360;
  modal(`<div class="voice"><div class="chara talking" id="chara" style="filter:hue-rotate(${h}deg)">${CHARA}<span class="badge" style="filter:hue-rotate(${-h}deg)">${esc(av||'')}</span></div><div class="stack" style="gap:4px;min-width:0"><span class="who">${esc(who)}</span><p class="say" id="sayTxt"></p></div></div>`,{onClose,btn});
  const fin=typeInto($('#sayTxt'),text,()=>{const c=$('#chara');c&&c.classList.remove('talking');});
  $('#sayTxt').onclick=fin;
}
let toastT=null;
function toast(text){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}t.textContent=text;t.style.animation='none';void t.offsetWidth;t.style.animation='';clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600);}

/* ---------- evidence bag ---------- */
function bagAdd(id,title,html,icon){
  if(!S.bag.find(b=>b.id===id)){S.bag.push({id,title,html,icon:icon||'✦'});save();const b=$('#hudBag');if(b){b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');}$('#bagN').textContent=S.bag.length;}
  renderBag();
}
function bagOpen(id){const b=S.bag.find(x=>x.id===id);if(b)modal(`<h3>${esc(b.title)}</h3>${b.html}`);}

function wireLock(id,len,onSubmit){
  const el=document.getElementById(id);if(!el)return;let v='';
  const show=()=>el.querySelectorAll('.disp span').forEach((s,i)=>{s.textContent=v[i]||'';s.classList.toggle('f',!!v[i])});
  const press=k=>{sfx('click');if(k==='c'){v='';show();return;}if(k==='go'){if(v.length<len){fail(el,null,'');return;}const r=onSubmit(v);if(r===false){v='';show();if(S&&S.diff==='hard'&&S.screen==='room'){S.pen+=20;save();toast('مستوى صعب: كل كود غلط = −٢٠ ثانية');}}return;}if(v.length<len){v+=k;show();}};
  el.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>press(b.dataset.k));
  el._press=press;
  if(!wireLock.kb){wireLock.kb=true;document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea')||$('#modalRoot').innerHTML)return;const L=document.querySelector('.lock:not(.open)');if(!L||!L._press)return;const d=digits(e.key);if(d.length===1)L._press(d);else if(e.key==='Enter')L._press('go');else if(e.key==='Backspace')L._press('c');});}
}

function api(){
  const R=rooms(), room=R[S.room], key=room.key;
  S.st[key]=S.st[key]||{};
  return {
    st:S.st[key], run:S, all:S.st, gen:S.gen||{}, H, digits, esc, shuffle, fmt, clockTime,
    check:(k,v)=>H(v)===k,
    solve(delay=900){S.hints[key]=S.hints[key]||0;setTimeout(()=>{if(S.room<R.length-1){const nx=R[S.room+1];curtain('الغرفة '+(S.room+2)+' من '+R.length,nx.title,()=>{S.room++;S.roomAt=Date.now();save();syncRace();render();window.scrollTo({top:0});});}else{S.doneAt=Date.now();S.screen='win';save();render();window.scrollTo({top:0});}},delay)},
    win(winner){S.winner=winner||'';S.doneAt=Date.now();S.screen='win';save();render();},
    rerender(){save();renderRoom(true)}, save,
    fail, good, sfx, voice, modal, toast, prism, lockHTML, wireLock,
    bag:{add:bagAdd,has:id=>!!S.bag.find(b=>b.id===id),open:bagOpen},
    player:(i,fb)=>(S.players[i]||'').trim()||fb, elapsed,
    race:RACE,
  };
}
function renderRoom(keepScroll){
  const R=rooms(), room=R[S.room], key=room.key, app=$('#app');
  const HL=S.diff==='hard'?room.hints.slice(0,2):room.hints;
  const used=Math.min(S.hints[key]||0,HL.length), pc=(S.diff==='easy'&&used===0)?0:S.penalty, cost=pc?(pc>=60?`−${pc/60} د`:`−${pc} ث`):'مجاني';
  const H3=HL.map((h,i)=>{const o=typeof h==='string'?{text:h}:h;const open=i<used, next=i===used;
    return `<button class="hcard ${open?'open':''} ${next?'next':''} ${o.prism?'cubey':''}" type="button" data-h="${i}" ${(!open&&!next)?'disabled':''} aria-label="كارت مساعدة ${i+1}">
      <span class="face back"><b>${i+1}</b><small>${open?'':next?`اقلبوا الكارت · ${cost}`:'مقفول'}</small></span>
      <span class="face front">${open?(o.prism?prism(o.prism,true):'')+`<span>${o.text}</span>`:''}</span></button>`}).join('');
  app.innerHTML=`<section class="${keepScroll?'quiet':'scene-in'} stack" style="gap:18px">
    <div class="room-head"><div class="stack" style="gap:2px"><span class="eyebrow">الغرفة ${S.room+1} من ${R.length}</span><h2>${esc(room.title)}</h2></div></div>
    <div class="goal"><b>المهمة</b><span>${room.goal}</span></div>
    <div class="layout"><div class="stack" style="gap:22px;min-width:0"><div id="roomBody" class="stack" style="gap:20px"></div>
      <div class="hints"><div class="row" style="justify-content:space-between"><b>كروت المساعدة</b><span class="muted" style="font-size:.85rem">${used}/${HL.length}</span></div><div class="hint-row">${H3}</div></div></div>
      <aside class="side"><div class="bag" id="bag"></div></aside></div>
  </section>`;
  room.render($('#roomBody'),api());
  renderBag();
  app.querySelectorAll('.hcard.next').forEach(b=>b.onclick=()=>{
    S.hints[key]=used+1;S.pen+=pc;S.roomAt=Date.now();save();sfx('magic');
    if(S.race&&RACE.onHint)RACE.onHint();

    setTimeout(()=>renderRoom(true),950);
  });

}

async function submitRun(won){

function newCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join('')}
const TAB=Math.random().toString(36).slice(2,10);
let lastSync='',raceSubs=[];
const RACE={joined:[],onWinner:null,
  async claim(name,code){code=code||S.code;const db=DBX.db;if(!db||!code)return {won:true};const ref=db.doc('games/'+code+'/meta/winner');
    try{const r=await ref.acquire({holder:TAB,ttlMs:5000});if(!r.acquired){await new Promise(z=>setTimeout(z,1200));const s=await ref.get();return {won:false,by:s.exists?s.data().name:''};}

/* ---------- live status, host controls, team QR ---------- */
const SHARE_URL='https://claude.ai/artifact/UwPmQZ7f3u67pQd59zL1m1';
let liveKey='',liveUnsub=null,liveCode='';
function liveSync(){
  const db=DBX.db;if(!db||!S||!S.code||!S.startedAt)return;const R=rooms();
  const body={game:S.game,team:S.team,room:S.room,rooms:R.length,title:(R[S.room]||{}).title||'',screen:S.screen,startedAt:S.startedAt,minutes:S.minutes,pen:Math.round(S.pen),hints:Object.values(S.hints).reduce((a,b)=>a+b,0),diff:S.diff||'normal',pausedAt:S.pausedAt||0,doneAt:S.doneAt||0};
  const k=JSON.stringify(body);if(k===liveKey)return;liveKey=k;db.doc('live/'+S.code).set({...body,at:Date.now()}).catch(()=>{});
}
function liveWatch(){
  const db=DBX.db;if(!db||!S||!S.code||liveCode===S.code)return;if(liveUnsub)liveUnsub();liveCode=S.code;
  liveUnsub=db.doc('live/'+S.code+'/cmd/now').onSnapshot(s=>{
    if(!s.exists||!S||S.code!==liveCode||S.screen!=='room')return;const d=s.data();S.cmd=S.cmd||{hintN:0,addMin:0,noteN:0};let ch=false;
    if((d.hintN|0)>S.cmd.hintN){S.cmd.hintN=d.hintN|0;const key=rooms()[S.room].key,max=S.diff==='hard'?2:3;if((S.hints[key]||0)<max){S.hints[key]=(S.hints[key]||0)+1;sfx('magic');toast('المنظِّم فتحلكم كارت مساعدة مجاني.');}ch=true;}
    if((d.addMin|0)!==S.cmd.addMin){S.pen-=((d.addMin|0)-S.cmd.addMin)*60;S.cmd.addMin=d.addMin|0;toast('المنظِّم عدّل الوقت.');ch=true;}
    if(!!d.pause!==!!S.pausedAt){if(d.pause)S.pausedAt=Date.now();else{S.pen-=(Date.now()-S.pausedAt)/1000;S.pausedAt=0;}ch=true;}
    if((d.noteN|0)>S.cmd.noteN){S.cmd.noteN=d.noteN|0;ch=true;if(d.note)voice('المنظِّم',esc(d.note),{av:'📣'});}
    if(ch){save();if(S.screen==='room'&&!$('#modalRoot').innerHTML)renderRoom(true);hud();}
  },()=>{});
}
function qrModal(){
  if(!S||!S.code)return;const url=(DBX.db?SHARE_URL:location.href.split('#')[0])+'#t-'+S.code;let svg='';
  try{const q=qrcode(0,'M');q.addData(url);q.make();svg=q.createSvgTag({cellSize:5,margin:2,scalable:true});}catch(e){}
  modal(`<h3>انضموا للفريق</h3>${svg?`<div class="qr">${svg}</div>`:''}<p style="text-align:center">كود الفريق: <span class="bigcode">${esc(S.code)}</span></p><p class="muted" style="text-align:center">امسحوا الكود بكاميرا الموبايل عشان تدخلوا شات الفريق${S.race?' ومحطة السباق':''}. لازم تكونوا عاملين تسجيل دخول والصفحة متشاركة معاكم.</p>`);
}
const HOST={teams:[],unsub:null,timer:null};
const hostRemain=t=>Math.max(0,t.minutes*60-(((t.doneAt||t.pausedAt||Date.now())-t.startedAt)/1000+(t.pen||0)));
function renderHost(){
  const app=$('#app'),back='<div class="row"><a href="#" class="btn ghost sm">كل الأبواب</a></div>';
  if(DBX.state==='off'){app.innerHTML=`<section class="stack scene-in">${back}<h2>شاشة المنظِّم</h2><div class="board-empty">شاشة المنظِّم شغالة من لينك Claude بس، وانتوا عاملين تسجيل دخول.</div></section>`;return;}
  if(!DBX.db){app.innerHTML=`<section class="stack">${back}<h2>شاشة المنظِّم</h2><p class="muted">بنحمّل…</p></section>`;return;}
  if(!DBX.canClear){app.innerHTML=`<section class="stack scene-in">${back}<h2>شاشة المنظِّم</h2><div class="board-empty">الشاشة دي لصاحب الصفحة والمحررين بس.</div></section>`;return;}
  if(!HOST.unsub){HOST.unsub=DBX.db.collection('live').orderBy('at','desc').limit(60).onSnapshot(s=>{HOST.teams=s.docs.map(d=>({code:d.id,...d.data()}));if(route.view==='host')drawHost();},()=>{});
    HOST.timer=setInterval(()=>{if(route.view!=='host')return;document.querySelectorAll('[data-rem]').forEach(el=>{const t=HOST.teams.find(x=>x.code===el.dataset.rem);if(t){const r=hostRemain(t);el.textContent=fmt(r);el.classList.toggle('low',r<=120);}});},1000);}
  app.innerHTML=`<section class="stack scene-in" style="gap:18px">${back}<div><span class="eyebrow">تحكم مباشر</span><h2>شاشة المنظِّم</h2><p class="muted">كل فريق بدأ لعبة بيظهر هنا. ابعتوا مساعدة مجانية، زوّدوا وقت، وقّفوا اللعبة، أو ابعتوا رسالة.</p></div><div id="hostGrid" class="host-grid"></div></section>`;
  drawHost();
}
function drawHost(){
  const grid=$('#hostGrid');if(!grid||(document.activeElement&&document.activeElement.classList.contains('hnote')))return;
  const live=HOST.teams.filter(t=>t.startedAt&&Date.now()-(t.at||0)<6*3600e3);
  if(!live.length){grid.innerHTML='<div class="board-empty" style="grid-column:1/-1">لسه مفيش فرق بدأت. أول ما فريق يدوس "ابدأوا العدّاد" هيظهر هنا.</div>';return;}
  grid.innerHTML=live.map(t=>{const g=GAMES[t.game]||{},playing=t.screen==='room',st=t.screen==='win'?'خلّصوا':t.screen==='lose'?'الوقت خلص':t.pausedAt?'متوقف':'بيلعبوا';
    return `<div class="hteam ${playing?'':'done'}"><div class="top"><div style="min-width:0"><b>${esc(t.team||'—')}</b> <span class="mono muted">${esc(t.code)}</span><div class="muted" style="font-size:.88rem">${esc(g.title||'')}</div></div><span class="pillst">${st}</span></div>
      <div class="top"><span>الغرفة ${Math.min((t.room|0)+1,t.rooms||3)} من ${t.rooms||3} · ${esc(t.title||'')}</span><b class="rem" data-rem="${esc(t.code)}">${fmt(hostRemain(t))}</b></div>
      <div class="bar"><i style="width:${Math.round(((t.screen==='win'?t.rooms:(t.room|0))/(t.rooms||3))*100)}%"></i></div>
      <div class="muted" style="font-size:.85rem">كروت مساعدة: ${t.hints|0} · المستوى: ${({easy:'سهل',hard:'صعب'})[t.diff]||'عادي'}</div>
      ${playing?`<div class="acts"><button class="btn sm" type="button" data-c="${esc(t.code)}" data-a="hint">مساعدة مجانية</button><button class="btn sm ghost" type="button" data-c="${esc(t.code)}" data-a="add">+ دقيقة</button><button class="btn sm ghost" type="button" data-c="${esc(t.code)}" data-a="pause">${t.pausedAt?'كمّلوا':'وقّفوا'}</button></div>
      <form data-c="${esc(t.code)}" autocomplete="off"><input class="field hnote" maxlength="140" placeholder="رسالة للفريق" aria-label="رسالة للفريق ${esc(t.team||'')}"><button class="btn sm" type="submit">ابعت</button></form>`:''}</div>`}).join('');
  grid.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>hostCmd(b.dataset.c,d=>{if(b.dataset.a==='hint')d.hintN=(d.hintN|0)+1;else if(b.dataset.a==='add')d.addMin=(d.addMin|0)+1;else d.pause=!d.pause;}));
  grid.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();const i=f.querySelector('input'),v=i.value.trim();if(!v)return;i.value='';i.blur();hostCmd(f.dataset.c,d=>{d.note=v.slice(0,140);d.noteN=(d.noteN|0)+1;});});
}
async function hostCmd(code,fn){const ref=DBX.db.doc('live/'+code+'/cmd/now');try{const s=await ref.get(),d=Object.assign({hintN:0,addMin:0,pause:false,noteN:0,note:''},s.exists?s.data():{});fn(d);await ref.set(d);toast('اتبعت للفريق.');}catch(e){toast('ماتبعتش. جربوا تاني.');}}

/* ---------- team chat (db: chats/{code}/msgs) ---------- */
const CHAT={code:'',name:'',msgs:[],unsub:null,subCode:'',open:false,seen:0,err:false,del:new Set()};
const viaNtfy=()=>!DBX.db&&!window.claude;
const chatAvail=()=>!!DBX.db||viaNtfy();
const chatWord=()=>viaNtfy()?'مسودة الفريق':'شات الفريق';
const NTFY='https://ntfy.sh/';
const ntfyTopic=c=>'duckescape-chat-'+String(c).toLowerCase();
try{const c=JSON.parse(localStorage.getItem('oe-chat')||'null');if(c){CHAT.code=c.code||'';CHAT.name=c.name||'';}}catch(e){}
function chatJoin(code,name){CHAT.code=String(code||'').toUpperCase();if(name)CHAT.name=String(name).slice(0,20);try{localStorage.setItem('oe-chat',JSON.stringify({code:CHAT.code,name:CHAT.name}))}catch(e){}chatSub();chatUI();}
function chatSub(){
  if(!chatAvail()||!CHAT.code||CHAT.subCode===CHAT.code)return;
  if(CHAT.unsub)CHAT.unsub();CHAT.msgs=[];CHAT.del=new Set();CHAT.seen=0;CHAT.subCode=CHAT.code;CHAT.err=false;
  if(viaNtfy()){
    if(!window.EventSource){CHAT.err=true;chatUI();return;}
    const ids=new Set(),es=new EventSource(NTFY+ntfyTopic(CHAT.code)+'/sse?since=12h'),t0=Date.now();
    es.onmessage=ev=>{try{const d=JSON.parse(ev.data);if(d.event!=='message'||ids.has(d.id))return;ids.add(d.id);const m=JSON.parse(d.message);if(!m)return;CHAT.err=false;
      if(typeof m.x==='string'){CHAT.del.add(m.x);chatUI();return;}
      if(typeof m.t!=='string')return;
      CHAT.msgs.push({id:d.id,name:String(m.n||'').slice(0,20),text:m.t.slice(0,300),at:(d.time||0)*1000,tab:m.k});CHAT.msgs=CHAT.msgs.slice(-150);
      if(!CHAT.open){if(Date.now()-t0>1500&&m.k!==TAB)sfx('drip');else if(Date.now()-t0<=1500)CHAT.seen=CHAT.msgs.length;}
      chatUI();}catch(e){}};
    es.onerror=()=>{if(!CHAT.msgs.length){CHAT.err=true;chatUI();}};
    CHAT.unsub=()=>es.close();return;
  }
  CHAT.unsub=DBX.db.collection('chats/'+CHAT.code+'/msgs').orderBy('at','desc').limit(120).onSnapshot(s=>{
    const first=!CHAT.msgs.length;CHAT.msgs=s.docs.map(d=>d.data()).reverse();if(first&&!CHAT.open)CHAT.seen=CHAT.msgs.length;
    if(!CHAT.open&&CHAT.msgs.length>CHAT.seen){const m=CHAT.msgs[CHAT.msgs.length-1];if(m&&m.tab!==TAB)sfx('drip');}
    chatUI();},()=>{});
}
async function ntfySend(obj){try{const r=await fetch(NTFY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:ntfyTopic(CHAT.code),message:JSON.stringify(obj),title:'DUCK'})});if(!r.ok)throw 0;}catch(e){toast('ماتبعتتش. جربوا تاني.');}}
function chatUI(){
  const fab=$('#chatFab'),box=$('#chat');if(!fab)return;
  const on=!!(chatAvail()&&CHAT.code);
  fab.hidden=!on||CHAT.open;box.hidden=!on||!CHAT.open;
  fab.firstChild.nodeValue=chatWord();
  const n=fab.querySelector('.n'),un=Math.max(0,CHAT.msgs.length-CHAT.seen);n.hidden=!un;n.textContent=un;
  if(!on||!CHAT.open)return;
  CHAT.seen=CHAT.msgs.length;
  const draft=$('#chatIn')?$('#chatIn').value:'',had=document.activeElement&&document.activeElement.id==='chatIn';
  const draft_=viaNtfy(),vis=CHAT.msgs.filter(m=>!CHAT.del.has(m.id));
  box.classList.toggle('draft',draft_);
  box.innerHTML=`<header><b>${chatWord()} · <span class="mono ltr">${esc(CHAT.code)}</span></b><button type="button" id="chatX" aria-label="إغلاق">×</button></header>
    ${draft_?'<p class="note">كل أعضاء الفريق بيكتبوا هنا ويشوفوا نفس المسودة. دوسوا × على السطر عشان تشطبوه. المسودة عامة: ماتكتبوش فيها بيانات خاصة.</p>':''}<div class="list" id="chatList">${vis.length?vis.map(m=>draft_?`<div class="dl"><span class="dn">${esc(m.name||'')}</span><span class="dt">${esc(m.text||'')}</span><button type="button" class="dx" data-x="${esc(m.id)}" aria-label="شطب السطر">×</button></div>`:`<div class="m ${m.tab===TAB?'me':''}"><small>${esc(m.name||'')}</small><span>${esc(m.text||'')}</span></div>`).join(''):`<p class="empty">${CHAT.err?'مش قادرين نوصل للمسودة دلوقتي. جربوا تاني بعد شوية.':draft_?'المسودة فاضية. اكتبوا أول دليل لقيتوه.':'لسه مفيش رسايل. ابعتوا أول دليل لقيتوه.'}</p>`}</div>
    <form id="chatForm" autocomplete="off"><input class="field" id="chatIn" maxlength="300" placeholder="${CHAT.name?(draft_?'اكتبوا سطر في المسودة':'اكتبوا رسالة'):'اكتب اسمك الأول'}" aria-label="رسالة"><button class="btn sm" type="submit">${CHAT.name?(draft_?'أضيف':'ابعت'):'تمام'}</button></form>`;
  box.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>ntfySend({x:b.dataset.x}));
  const list=$('#chatList');list.scrollTop=list.scrollHeight;
  $('#chatIn').value=draft;if(had)$('#chatIn').focus({preventScroll:true});
  $('#chatX').onclick=()=>{CHAT.open=false;chatUI();};
  $('#chatForm').onsubmit=async e=>{e.preventDefault();const v=$('#chatIn').value.trim();if(!v)return;
    if(!CHAT.name){chatJoin(CHAT.code,v);$('#chatIn').value='';chatUI();return;}
    $('#chatIn').value='';
    if(viaNtfy()){ntfySend({n:CHAT.name,t:v.slice(0,300),k:TAB});return;}
    try{await DBX.db.collection('chats/'+CHAT.code+'/msgs').add({name:CHAT.name,text:v.slice(0,300),at:Date.now(),tab:TAB});}catch(err){toast('الرسالة ماتبعتتش.');}};
}

/* ---------- boot ---------- */
function register(g){GAMES[g.id]=g;ORDER.push(g.id);}
function boot(){
  const r=load(); if(r&&GAMES[r.game]&&(r.screen!=='room'||r.gen))S=r;
  const hot=window.claude?.hot;
  hot?.snapshot?.(()=>({S}));
  const startUp=d=>{if(d&&d.S)S=d.S;onRoute();};
  hot?.ready?hot.ready(startUp):startUp(hot?.data??{});
  $('#hudBag').onclick=bagModal;$('#hudCode').onclick=qrModal;audInit();
  const li=new Image();li.onload=()=>{LOGOIMG=true;$('#hudLogo').innerHTML=LOGO(true);if(route.view==='home')home();};li.src='logo.png';$('#hudLogo').innerHTML=LOGO(true);
  $('#chatFab').onclick=()=>{CHAT.open=true;chatUI();setTimeout(()=>{const i=$('#chatIn');i&&i.focus({preventScroll:true})},50);};
}
return {register,boot,H,esc,digits,sfx,prism,RACE,DBX,shuffle,RND,slot,sceneOpen,art,trim,get S(){return S},TAB};
})();
